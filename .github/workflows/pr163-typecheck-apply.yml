name: PR 163 Typecheck Apply

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr163-typecheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    name: Apply PR 163 typecheck fixes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/phase-2d-b-checkout-integration
          persist-credentials: true

      - name: Upgrade Phase 2D test fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          branch = """      branch: {
                id: '90000000-0000-4000-8000-000000000001',
                code: 'TIR-01',
                name: 'Tirupati Branch',
                type: 'PHYSICAL_STORE',
                addressId: 'a0000000-0000-4000-8000-000000000001',
                returnAddressId: 'b0000000-0000-4000-8000-000000000001',
                pincode: '517501',
                latitude: 13.6288,
                longitude: 79.4192,
              },
              geography: {
                cityId: 'c0000000-0000-4000-8000-000000000001',
                cityCode: 'TIRUPATI',
                cityName: 'Tirupati',
                serviceZoneId: 'd0000000-0000-4000-8000-000000000001',
                serviceZoneCode: 'TIR-CENTRAL',
                serviceZoneName: 'Tirupati Central',
                customerPincode: '517501',
                fulfilmentMode: 'LOCAL_DELIVERY',
                distanceMeters: 500,
                deliveryRadiusMeters: 5000,
              },
          """

          quote_files = [
              Path('apps/backend/src/catalogue/customer-checkout-quote.integration.test.ts'),
              Path('apps/backend/src/catalogue/customer-checkout-quote.service.test.ts'),
          ]
          for path in quote_files:
              text = path.read_text()
              text = text.replace("      id: QUOTE_ID,\n      cartId:", "      id: QUOTE_ID,\n      contractVersion: 2,\n      cartId:", 1)
              old_shop_start = "      shop: {\n"
              shop_start = text.index(old_shop_start)
              items_start = text.index("      items: [", shop_start)
              shop_block = text[shop_start:items_start]
              minimum = "50000" if "minimumOrderPaise: 50000" in shop_block else "0"
              replacement = f"""      shop: {{
                id: SHOP_ID,
                name: 'Quote Shop',
                slug: 'quote-shop',
                minimumOrderPaise: {minimum},
              }},
          """ if path.name.endswith('service.test.ts') else f"""      shop: {{
                id: '50000000-0000-4000-8000-000000000001',
                name: 'Quote Shop',
                slug: 'quote-shop',
                minimumOrderPaise: {minimum},
              }},
          """
              text = text[:shop_start] + replacement + branch + text[items_start:]
              text = text.replace('inventoryVersion:', 'branchInventoryVersion:', 1)
              text = text.replace(
                  "      estimatedPreparationMinutes: 20,",
                  "      fulfilmentMode: 'LOCAL_DELIVERY',\n      codEligible: true,\n      codLimitPaise: 100000,\n      estimatedPreparationMinutes: 20,",
                  1,
              )
              text = text.replace(
                  "      estimatedDeliveryAt: '2026-07-15T21:35:00.000Z',",
                  "      estimatedDeliveryAt: '2026-07-15T21:35:00.000Z',\n      cityConfigurationVersion: 1,",
                  1,
              )
              path.write_text(text)

          order_branch = """      branch: {
                id: 'b0000000-0000-4000-8000-000000000001',
                code: 'TIR-01',
                name: 'Tirupati Branch',
                type: 'PHYSICAL_STORE',
                addressId: 'c0000000-0000-4000-8000-000000000001',
                returnAddressId: 'd0000000-0000-4000-8000-000000000001',
                pincode: '517501',
                latitude: 13.6288,
                longitude: 79.4192,
              },
              geography: {
                cityId: 'e0000000-0000-4000-8000-000000000001',
                cityCode: 'TIRUPATI',
                cityName: 'Tirupati',
                serviceZoneId: 'f0000000-0000-4000-8000-000000000001',
                serviceZoneCode: 'TIR-CENTRAL',
                serviceZoneName: 'Tirupati Central',
                customerPincode: '517501',
                fulfilmentMode: 'LOCAL_DELIVERY',
                distanceMeters: 500,
                deliveryRadiusMeters: 5000,
              },
              commercial: {
                deliveryFeePaise: 0,
                codEligible: true,
                codLimitPaise: 100000,
                merchantCommissionBps: 1000,
                cityConfigurationVersion: 1,
                cancellationPolicy: {},
                refundPolicy: {},
              },
          """

          order_files = [
              Path('apps/backend/src/orders/customer-order.integration.test.ts'),
              Path('apps/backend/src/orders/customer-order.service.test.ts'),
          ]
          for path in order_files:
              text = path.read_text()
              text = text.replace("      quoteId: input.quoteId,", "      quoteId: input.quoteId,\n      contractVersion: 2,", 1)
              text = text.replace("    quoteId: QUOTE_ID,", "    quoteId: QUOTE_ID,\n    contractVersion: 2,", 1)
              shop_start = text.index("      shop: {") if path.name.endswith('integration.test.ts') else text.index("    shop: {")
              address_marker = "      address: {" if path.name.endswith('integration.test.ts') else "    address: {"
              address_start = text.index(address_marker, shop_start)
              text = text[:address_start] + order_branch + text[address_start:]
              text = text.replace(
                  "      fulfilmentType: 'DELIVERY',",
                  "      fulfilmentType: 'DELIVERY',\n      fulfilmentMode: 'LOCAL_DELIVERY',",
                  1,
              )
              text = text.replace(
                  "    fulfilmentType: 'DELIVERY',",
                  "    fulfilmentType: 'DELIVERY',\n    fulfilmentMode: 'LOCAL_DELIVERY',",
                  1,
              )
              path.write_text(text)
          PY

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and verify backend
        run: |
          pnpm exec prettier --write \
            apps/backend/src/catalogue/customer-checkout-quote.integration.test.ts \
            apps/backend/src/catalogue/customer-checkout-quote.service.test.ts \
            apps/backend/src/orders/customer-order.integration.test.ts \
            apps/backend/src/orders/customer-order.service.test.ts
          pnpm --filter @vastra/backend typecheck
          pnpm --filter @vastra/backend test

      - name: Commit typecheck fixes
        run: |
          if git diff --quiet; then
            echo "No typecheck changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/backend/src/catalogue/customer-checkout-quote.integration.test.ts \
            apps/backend/src/catalogue/customer-checkout-quote.service.test.ts \
            apps/backend/src/orders/customer-order.integration.test.ts \
            apps/backend/src/orders/customer-order.service.test.ts
          git commit -m "test(checkout): align backend fixtures with Phase 2D"
          git push origin HEAD:agent/phase-2d-b-checkout-integration

name: PR 163 Typecheck Apply

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr163-typecheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    name: Apply PR 163 typecheck fixes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/phase-2d-b-checkout-integration
          persist-credentials: true

      - name: Upgrade Phase 2D test fixtures
        run: |
          cat > /tmp/upgrade_fixtures.py <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected exactly one match, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1))

          quote_branch = (
              "      branch: {\n"
              "        id: '90000000-0000-4000-8000-000000000001',\n"
              "        code: 'TIR-01',\n"
              "        name: 'Tirupati Branch',\n"
              "        type: 'PHYSICAL_STORE',\n"
              "        addressId: 'a0000000-0000-4000-8000-000000000001',\n"
              "        returnAddressId: 'b0000000-0000-4000-8000-000000000001',\n"
              "        pincode: '517501',\n"
              "        latitude: 13.6288,\n"
              "        longitude: 79.4192,\n"
              "      },\n"
              "      geography: {\n"
              "        cityId: 'c0000000-0000-4000-8000-000000000001',\n"
              "        cityCode: 'TIRUPATI',\n"
              "        cityName: 'Tirupati',\n"
              "        serviceZoneId: 'd0000000-0000-4000-8000-000000000001',\n"
              "        serviceZoneCode: 'TIR-CENTRAL',\n"
              "        serviceZoneName: 'Tirupati Central',\n"
              "        customerPincode: '517501',\n"
              "        fulfilmentMode: 'LOCAL_DELIVERY',\n"
              "        distanceMeters: 500,\n"
              "        deliveryRadiusMeters: 5000,\n"
              "      },\n"
          )

          quote_integration = Path('apps/backend/src/catalogue/customer-checkout-quote.integration.test.ts')
          replace_once(
              quote_integration,
              "      id: QUOTE_ID,\n      cartId: CART_ID,",
              "      id: QUOTE_ID,\n      contractVersion: 2,\n      cartId: CART_ID,",
          )
          replace_once(
              quote_integration,
              "      shop: {\n"
              "        id: '50000000-0000-4000-8000-000000000001',\n"
              "        name: 'Quote Shop',\n"
              "        slug: 'quote-shop',\n"
              "        minimumOrderPaise: 0,\n"
              "        averagePreparationMinutes: 20,\n"
              "        distanceMeters: 500,\n"
              "        serviceRadiusMeters: 5000,\n"
              "      },\n",
              "      shop: {\n"
              "        id: '50000000-0000-4000-8000-000000000001',\n"
              "        name: 'Quote Shop',\n"
              "        slug: 'quote-shop',\n"
              "        minimumOrderPaise: 0,\n"
              "      },\n" + quote_branch,
          )
          replace_once(quote_integration, '          inventoryVersion: 1,', '          branchInventoryVersion: 1,')
          replace_once(
              quote_integration,
              "      estimatedPreparationMinutes: 20,",
              "      fulfilmentMode: 'LOCAL_DELIVERY',\n"
              "      codEligible: true,\n"
              "      codLimitPaise: 100000,\n"
              "      estimatedPreparationMinutes: 20,",
          )
          replace_once(
              quote_integration,
              "      estimatedDeliveryAt: '2026-07-15T21:35:00.000Z',",
              "      estimatedDeliveryAt: '2026-07-15T21:35:00.000Z',\n"
              "      cityConfigurationVersion: 1,",
          )

          quote_service = Path('apps/backend/src/catalogue/customer-checkout-quote.service.test.ts')
          replace_once(
              quote_service,
              "    id: QUOTE_ID,\n    cartId: CART_ID,",
              "    id: QUOTE_ID,\n    contractVersion: 2,\n    cartId: CART_ID,",
          )
          replace_once(
              quote_service,
              "    shop: {\n"
              "      id: SHOP_ID,\n"
              "      name: 'Quote Shop',\n"
              "      slug: 'quote-shop',\n"
              "      minimumOrderPaise: 50000,\n"
              "      averagePreparationMinutes: 20,\n"
              "      distanceMeters: 500,\n"
              "      serviceRadiusMeters: 5000,\n"
              "    },\n",
              "    shop: {\n"
              "      id: SHOP_ID,\n"
              "      name: 'Quote Shop',\n"
              "      slug: 'quote-shop',\n"
              "      minimumOrderPaise: 50000,\n"
              "    },\n" + quote_branch.replace('      ', '    ', 1),
          )
          replace_once(quote_service, '        inventoryVersion: 2,', '        branchInventoryVersion: 2,')
          replace_once(
              quote_service,
              "    estimatedPreparationMinutes: 20,",
              "    fulfilmentMode: 'LOCAL_DELIVERY',\n"
              "    codEligible: true,\n"
              "    codLimitPaise: 100000,\n"
              "    estimatedPreparationMinutes: 20,",
          )
          replace_once(
              quote_service,
              "    estimatedDeliveryAt: '2026-07-15T21:35:00.000Z',",
              "    estimatedDeliveryAt: '2026-07-15T21:35:00.000Z',\n"
              "    cityConfigurationVersion: 1,",
          )

          order_contract = (
              "      branch: {\n"
              "        id: 'b0000000-0000-4000-8000-000000000001',\n"
              "        code: 'TIR-01',\n"
              "        name: 'Tirupati Branch',\n"
              "        type: 'PHYSICAL_STORE',\n"
              "        addressId: 'c0000000-0000-4000-8000-000000000001',\n"
              "        returnAddressId: 'd0000000-0000-4000-8000-000000000001',\n"
              "        pincode: '517501',\n"
              "        latitude: 13.6288,\n"
              "        longitude: 79.4192,\n"
              "      },\n"
              "      geography: {\n"
              "        cityId: 'e0000000-0000-4000-8000-000000000001',\n"
              "        cityCode: 'TIRUPATI',\n"
              "        cityName: 'Tirupati',\n"
              "        serviceZoneId: 'f0000000-0000-4000-8000-000000000001',\n"
              "        serviceZoneCode: 'TIR-CENTRAL',\n"
              "        serviceZoneName: 'Tirupati Central',\n"
              "        customerPincode: '517501',\n"
              "        fulfilmentMode: 'LOCAL_DELIVERY',\n"
              "        distanceMeters: 500,\n"
              "        deliveryRadiusMeters: 5000,\n"
              "      },\n"
              "      commercial: {\n"
              "        deliveryFeePaise: 0,\n"
              "        codEligible: true,\n"
              "        codLimitPaise: 100000,\n"
              "        merchantCommissionBps: 1000,\n"
              "        cityConfigurationVersion: 1,\n"
              "        cancellationPolicy: {},\n"
              "        refundPolicy: {},\n"
              "      },\n"
          )

          order_integration = Path('apps/backend/src/orders/customer-order.integration.test.ts')
          replace_once(
              order_integration,
              "      quoteId: input.quoteId,",
              "      quoteId: input.quoteId,\n      contractVersion: 2,",
          )
          replace_once(
              order_integration,
              "      shop: {\n"
              "        id: '70000000-0000-4000-8000-000000000001',\n"
              "        name: 'Order Shop',\n"
              "        slug: 'order-shop',\n"
              "      },\n",
              "      shop: {\n"
              "        id: '70000000-0000-4000-8000-000000000001',\n"
              "        name: 'Order Shop',\n"
              "        slug: 'order-shop',\n"
              "      },\n" + order_contract,
          )
          replace_once(
              order_integration,
              "      fulfilmentType: 'DELIVERY',",
              "      fulfilmentType: 'DELIVERY',\n      fulfilmentMode: 'LOCAL_DELIVERY',",
          )

          order_service = Path('apps/backend/src/orders/customer-order.service.test.ts')
          replace_once(
              order_service,
              "    quoteId: QUOTE_ID,",
              "    quoteId: QUOTE_ID,\n    contractVersion: 2,",
          )
          replace_once(
              order_service,
              "    shop: {\n"
              "      id: '70000000-0000-4000-8000-000000000001',\n"
              "      name: 'Order Shop',\n"
              "      slug: 'order-shop',\n"
              "    },\n",
              "    shop: {\n"
              "      id: '70000000-0000-4000-8000-000000000001',\n"
              "      name: 'Order Shop',\n"
              "      slug: 'order-shop',\n"
              "    },\n" + order_contract.replace('      ', '    ', 1),
          )
          replace_once(
              order_service,
              "    fulfilmentType: 'DELIVERY',",
              "    fulfilmentType: 'DELIVERY',\n    fulfilmentMode: 'LOCAL_DELIVERY',",
          )
          PY
          python /tmp/upgrade_fixtures.py

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and verify backend
        run: |
          pnpm exec prettier --write \
            apps/backend/src/catalogue/customer-checkout-quote.integration.test.ts \
            apps/backend/src/catalogue/customer-checkout-quote.service.test.ts \
            apps/backend/src/orders/customer-order.integration.test.ts \
            apps/backend/src/orders/customer-order.service.test.ts
          pnpm --filter @vastra/backend typecheck
          pnpm --filter @vastra/backend test

      - name: Commit typecheck fixes
        run: |
          if git diff --quiet; then
            echo "No typecheck changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/backend/src/catalogue/customer-checkout-quote.integration.test.ts \
            apps/backend/src/catalogue/customer-checkout-quote.service.test.ts \
            apps/backend/src/orders/customer-order.integration.test.ts \
            apps/backend/src/orders/customer-order.service.test.ts
          git commit -m "test(checkout): align backend fixtures with Phase 2D"
          git push origin HEAD:agent/phase-2d-b-checkout-integration

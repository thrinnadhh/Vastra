name: Capture FE-S06 unit diagnostics

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/fe-s06-implementation-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Capture merchant unit output
        id: test
        shell: bash
        run: |
          set +e
          pnpm --filter @vastra/merchant-app test > fe-s06-unit.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: fe-s06-unit-diagnostics
          path: fe-s06-unit.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve unit result
        run: exit "${{ steps.test.outputs.exit_code }}"

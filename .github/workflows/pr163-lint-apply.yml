name: PR 163 Lint Apply

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr163-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    name: Apply PR 163 lint fixes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/phase-2d-b-checkout-integration
          persist-credentials: true

      - name: Apply exhaustive-switch fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'apps/backend/src/catalogue/customer-checkout-quote.gateway.ts': (
                  "    default:\n      return new CustomerCheckoutQuoteGatewayUnavailableError();",
                  "    case undefined:\n      return new CustomerCheckoutQuoteGatewayUnavailableError();\n    default:\n      return new CustomerCheckoutQuoteGatewayUnavailableError();",
              ),
              'apps/backend/src/orders/customer-order.gateway.ts': (
                  "    default:\n      return new CustomerOrderGatewayUnavailableError();",
                  "    case undefined:\n      return new CustomerOrderGatewayUnavailableError();\n    default:\n      return new CustomerOrderGatewayUnavailableError();",
              ),
              'apps/customer-app/src/checkout/customer-checkout-quote.screen.tsx': (
                  "    case 'UNSERVICEABLE_ADDRESS':\n      return 'This shop cannot deliver to the selected address.';\n    case 'STALE_QUOTE':",
                  "    case 'UNSERVICEABLE_ADDRESS':\n      return 'This shop cannot deliver to the selected address.';\n    case 'NO_FULFILMENT_BRANCH':\n      return 'This shop has no local fulfilment branch available for the selected address.';\n    case 'POSTAL_PRICING_REQUIRED':\n      return 'This address requires postal delivery pricing, which is not available in this checkout flow.';\n    case 'STALE_QUOTE':",
              ),
          }

          for name, (old, new) in replacements.items():
              path = Path(name)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source block not found in {name}')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and verify lint
        run: |
          pnpm exec prettier --write \
            apps/backend/src/catalogue/customer-checkout-quote.gateway.ts \
            apps/backend/src/orders/customer-order.gateway.ts \
            apps/customer-app/src/checkout/customer-checkout-quote.screen.tsx
          pnpm lint

      - name: Commit lint fixes
        run: |
          if git diff --quiet; then
            echo "No lint changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/backend/src/catalogue/customer-checkout-quote.gateway.ts \
            apps/backend/src/orders/customer-order.gateway.ts \
            apps/customer-app/src/checkout/customer-checkout-quote.screen.tsx
          git commit -m "fix(checkout): cover Phase 2D failure cases"
          git push origin HEAD:agent/phase-2d-b-checkout-integration

name: Phase 2E materialize workspace

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/phase-2e-city-activation

concurrency:
  group: phase-2e-materialize-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 8.15.0

jobs:
  package:
    if: github.head_ref == 'agent/phase-2e-city-activation' || github.ref == 'refs/heads/agent/phase-2e-city-activation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact source and package workspace
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          printf 'source_sha=%s\nworkflow_run_id=%s\n' "$source_sha" "$GITHUB_RUN_ID" > .vastra-materialization-source
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          tar -czf /tmp/vastra-phase-2e-workspace.tar.gz .
      - name: Use repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
      - name: Install exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          toolchain_root="${RUNNER_TEMP}/vastra-toolchain"
          corepack_home="${toolchain_root}/corepack"
          mkdir -p "$corepack_home"
          echo "COREPACK_HOME=$corepack_home" >> "$GITHUB_ENV"
          corepack enable
          COREPACK_HOME="$corepack_home" corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(COREPACK_HOME="$corepack_home" COREPACK_ENABLE_NETWORK=0 pnpm --version)" = "$PNPM_VERSION"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Package toolchain and dependencies
        shell: bash
        run: |
          set -euo pipefail
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          toolchain_root="${RUNNER_TEMP}/vastra-toolchain"
          mkdir -p "$toolchain_root/node"
          cp -a "$node_root"/. "$toolchain_root/node/"
          cp .vastra-materialization-source "$toolchain_root/source"
          tar -czf /tmp/node20-phase-2e-toolchain.tar.gz -C "$toolchain_root" .
          mapfile -d '' node_modules_dirs < <(find . -type d -name node_modules -prune -print0)
          test "${#node_modules_dirs[@]}" -gt 1
          tar -czf /tmp/vastra-phase-2e-dependencies.tar.gz \
            .vastra-materialization-source \
            "${node_modules_dirs[@]}"
      - name: Upload workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vastra-phase-2e-workspace
          path: /tmp/vastra-phase-2e-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Upload toolchain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node20-phase-2e-toolchain
          path: /tmp/node20-phase-2e-toolchain.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Upload dependencies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vastra-phase-2e-dependencies
          path: /tmp/vastra-phase-2e-dependencies.tar.gz
          if-no-files-found: error
          retention-days: 1

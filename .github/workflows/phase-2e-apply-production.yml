name: Apply reviewed Phase 2E production patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  PNPM_VERSION: 8.15.0

jobs:
  apply:
    if: github.head_ref == 'agent/phase-2e-city-activation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact Phase 2E branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/phase-2e-city-activation
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruct, verify and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/phase-2e-production-patch/part-* > /tmp/phase-2e-production.patch.gz.b64
          base64 --decode /tmp/phase-2e-production.patch.gz.b64 | gzip --decompress > /tmp/phase-2e-production.patch
          printf '%s  %s\n' 'b1141e3784a3086d32a87111885869c3144a9079f7292ff993f41d46b9edee2a' /tmp/phase-2e-production.patch | sha256sum --check --strict
          git apply --check /tmp/phase-2e-production.patch
          git apply /tmp/phase-2e-production.patch
          rm -rf \
            .github/phase-2e-production-patch \
            .github/phase-2e-production.patch.gz.b64 \
            .github/workflows/phase-2e-materialize.yml \
            .github/workflows/phase-2e-apply-db-fix.yml \
            .github/workflows/phase-2e-apply-production.yml \
            supabase/migrations/20260728113100_phase_2e_city_activation_hardening.sql
          git diff --check
      - name: Use repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
      - name: Install exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "$PNPM_VERSION"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify backend and OpenAPI slice
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @vastra/backend lint
          pnpm --filter @vastra/backend typecheck
          pnpm --filter @vastra/backend test -- admin-city
          pnpm openapi:check
          pnpm --filter @vastra/api-client build
      - name: Verify admin city control plane
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @vastra/admin-dashboard lint
          pnpm --filter @vastra/admin-dashboard typecheck
          pnpm --filter @vastra/admin-dashboard test
          pnpm --filter @vastra/admin-dashboard build
      - name: Commit production-only tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Vastra Phase 2E Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(admin): complete Phase 2E city activation control plane'
          git push origin HEAD:agent/phase-2e-city-activation

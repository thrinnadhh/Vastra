name: FE-S08 finalize backend implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fe-s08-finalize-backend
  cancel-in-progress: false

jobs:
  apply-validate-publish:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/fe-s08-backend-final'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out final branch
        uses: actions/checkout@v7
        with:
          ref: agent/fe-s08-backend-final
          fetch-depth: 0

      - name: Decode recovered production patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          chunks = sorted(Path('.github/fe-s08-final').glob('chunk-*'))
          if len(chunks) != 4:
              raise SystemExit(f'expected 4 chunks, found {len(chunks)}')
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
          raw = base64.b64decode(encoded + ('=' * (-len(encoded) % 4)), validate=False)
          patch = gzip.decompress(raw)
          Path('/tmp/fe-s08-production.patch').write_bytes(patch)
          print(f'decoded {len(patch)} patch bytes')
          PY
          test -s /tmp/fe-s08-production.patch
          git apply --check /tmp/fe-s08-production.patch

      - name: Apply production implementation and remove transport files
        run: |
          git apply /tmp/fe-s08-production.patch
          rm -rf .github/fe-s08-patch .github/fe-s08-final
          rm -f .github/workflows/fe-s08-materialize.yml
          rm -f .github/workflows/fe-s08-apply.yml
          rm -f .github/workflows/fe-s08-finalize.yml

      - name: Repair recovered static findings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/backend/src/admin/admin-capabilities.service.test.ts')
          text = path.read_text(encoding='utf-8').replace(
              '  public listGrantedPermissions(_client: SupabaseClient) {\n    return Promise.resolve',
              '  public listGrantedPermissions(client: SupabaseClient) {\n    void client;\n    return Promise.resolve',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('apps/backend/src/admin/admin-list.validation.ts')
          text = path.read_text(encoding='utf-8').replace(
              "  if (typeof value !== 'string' || !allowed.includes(value as T[number])) {\n    throw new AdminListQueryInvalidError();\n  }\n  return value as T[number];",
              "  if (typeof value !== 'string') throw new AdminListQueryInvalidError();\n  const matched = allowed.find((candidate) => candidate === value);\n  if (matched === undefined) throw new AdminListQueryInvalidError();\n  return matched;",
          )
          path.write_text(text, encoding='utf-8')

          path = Path('apps/backend/src/admin/admin-module-contracts.test.ts')
          text = path.read_text(encoding='utf-8').replace(
              "    expect(\n      readMetadata(REQUIRED_PERMISSIONS_METADATA, AdminCapabilitiesController.prototype.get),\n    ).toBeUndefined();",
              "    const handler: unknown = Object.getOwnPropertyDescriptor(\n      AdminCapabilitiesController.prototype,\n      'get',\n    )?.value;\n    if (typeof handler !== 'function') {\n      throw new TypeError('AdminCapabilitiesController.get must be a method');\n    }\n    expect(readMetadata(REQUIRED_PERMISSIONS_METADATA, handler)).toBeUndefined();",
          )
          path.write_text(text, encoding='utf-8')

          path = Path('apps/backend/src/admin/admin-order-list.gateway.ts')
          text = path.read_text(encoding='utf-8').replace(
              '  optionalPhoneLast4,\n  optionalString,\n  optionalUuid,',
              '  optionalPhoneLast4,\n  optionalUuid,',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('apps/backend/src/admin/admin-read-model.parser.ts')
          text = path.read_text(encoding='utf-8').replace(
              "  const value = requireString(record, key);\n  if (!allowed.includes(value as T[number])) throw new AdminReadModelInvalidError();\n  return value as T[number];",
              "  const value = requireString(record, key);\n  const matched = allowed.find((candidate) => candidate === value);\n  if (matched === undefined) throw new AdminReadModelInvalidError();\n  return matched;",
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Format implementation
        run: pnpm format > /tmp/fe-s08-format.log 2>&1

      - name: Check formatting
        run: |
          if ! pnpm format:check > /tmp/fe-s08-format-check.log 2>&1; then
            tail -n 200 /tmp/fe-s08-format-check.log
            exit 1
          fi

      - name: Run lint
        run: |
          if ! pnpm lint > /tmp/fe-s08-lint.log 2>&1; then
            tail -n 200 /tmp/fe-s08-lint.log
            exit 1
          fi

      - name: Run TypeScript checks
        run: |
          if ! pnpm typecheck > /tmp/fe-s08-typecheck.log 2>&1; then
            tail -n 200 /tmp/fe-s08-typecheck.log
            exit 1
          fi

      - name: Run backend unit tests
        run: |
          if ! pnpm --filter @vastra/backend test > /tmp/fe-s08-unit.log 2>&1; then
            tail -n 240 /tmp/fe-s08-unit.log
            exit 1
          fi

      - name: Run backend integration tests
        run: |
          if ! pnpm --filter @vastra/backend test:integration > /tmp/fe-s08-integration.log 2>&1; then
            tail -n 300 /tmp/fe-s08-integration.log
            exit 1
          fi

      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fe-s08-integration-diagnostics
          path: /tmp/fe-s08-integration.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Validate OpenAPI
        run: |
          if ! pnpm openapi:check > /tmp/fe-s08-openapi.log 2>&1; then
            tail -n 200 /tmp/fe-s08-openapi.log
            exit 1
          fi

      - name: Run database tests
        run: |
          if ! pnpm db:test > /tmp/fe-s08-db.log 2>&1; then
            tail -n 240 /tmp/fe-s08-db.log
            exit 1
          fi

      - name: Build backend
        run: |
          if ! pnpm --filter @vastra/backend build > /tmp/fe-s08-build.log 2>&1; then
            tail -n 200 /tmp/fe-s08-build.log
            exit 1
          fi

      - name: Commit validated production tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(fe-s08): implement admin observation and recovery backend"
          git push origin HEAD:agent/fe-s08-backend-final

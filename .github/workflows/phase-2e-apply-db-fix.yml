name: Apply Phase 2E database hardening

on:
  push:
    branches:
      - agent/phase-2e-city-activation
    paths:
      - .github/workflows/phase-2e-apply-db-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Phase 2E branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/phase-2e-city-activation
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed database corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260728113000_phase_2e_city_activation.sql')
          source = path.read_text()

          source = source.replace(
              "      'CONFIGURATION',\n      'CITY',",
              "      'CONFIGURATION',\n      'PAYMENT',\n      'PAYMENT_EVENT',\n      'RETURN_REQUEST',\n      'REFUND',\n      'MERCHANT_SETTLEMENT',\n      'CAPTAIN_EARNING',\n      'CAPTAIN_PAYOUT',\n      'COD_RECONCILIATION',\n      'CITY',",
          )
          source = source.replace(
              "from jsonb_object_keys(p_patch) as key\n  where key not in (",
              "from jsonb_object_keys(p_patch) as patch_key(key)\n  where key not in (",
          )
          source = source.replace(
              "v_resource_id := coalesce(p_zone_id, gen_random_uuid());",
              "v_resource_id := coalesce(p_zone_id, p_idempotency_key);",
          )
          source = source.replace(
              "v_resource_id uuid := coalesce(p_mapping_id, gen_random_uuid());",
              "v_resource_id uuid := coalesce(p_mapping_id, p_idempotency_key);",
          )
          source = source.replace(
              "z.status in ('READY_FOR_VALIDATION', 'ACTIVE')",
              "z.status in ('READY_FOR_VALIDATION', 'ACTIVE', 'PAUSED')",
          )

          old = """  from public.merchant_branches mb
          where mb.city_id = p_city_id
            and mb.status = 'ACTIVE'
            and mb.verification_status = 'VERIFIED'
            and mb.geography_status = 'VERIFIED'
            and mb.local_delivery_enabled;"""
          new = """  from public.merchant_branches mb
          join public.shops shop on shop.id = mb.shop_id
          join public.merchant_profiles merchant on merchant.user_id = mb.merchant_id
          join public.profiles merchant_profile on merchant_profile.id = mb.merchant_id
          where mb.city_id = p_city_id
            and mb.status in ('APPROVED', 'ACTIVE')
            and mb.verification_status = 'VERIFIED'
            and mb.geography_status = 'VERIFIED'
            and mb.local_delivery_enabled
            and shop.deleted_at is null
            and shop.verification_status = 'VERIFIED'
            and shop.operational_status not in ('PAUSED', 'SUSPENDED')
            and merchant.kyc_status = 'VERIFIED'
            and merchant.onboarding_status = 'ACTIVE'
            and merchant_profile.status = 'ACTIVE';"""
          if old not in source:
              raise SystemExit('merchant readiness block not found')
          source = source.replace(old, new)

          old = """      from public.merchant_branches mb
                left join public.branch_service_zones bsz
                  on bsz.branch_id = mb.id
                 and bsz.city_id = mb.city_id
                 and bsz.is_active
                where mb.city_id = p_city_id
                  and mb.status = 'ACTIVE'
                  and mb.verification_status = 'VERIFIED'
                  and mb.geography_status = 'VERIFIED'
                  and mb.local_delivery_enabled
                  and ("""
          new = """      from public.merchant_branches mb
                join public.shops shop on shop.id = mb.shop_id
                join public.merchant_profiles merchant on merchant.user_id = mb.merchant_id
                join public.profiles merchant_profile on merchant_profile.id = mb.merchant_id
                left join public.branch_service_zones bsz
                  on bsz.branch_id = mb.id
                 and bsz.city_id = mb.city_id
                 and bsz.is_active
                where mb.city_id = p_city_id
                  and mb.status in ('APPROVED', 'ACTIVE')
                  and mb.verification_status = 'VERIFIED'
                  and mb.geography_status = 'VERIFIED'
                  and mb.local_delivery_enabled
                  and shop.deleted_at is null
                  and shop.verification_status = 'VERIFIED'
                  and shop.operational_status not in ('PAUSED', 'SUSPENDED')
                  and merchant.kyc_status = 'VERIFIED'
                  and merchant.onboarding_status = 'ACTIVE'
                  and merchant_profile.status = 'ACTIVE'
                  and ("""
          if old not in source:
              raise SystemExit('merchant coverage block not found')
          source = source.replace(old, new)

          needle = """  perform private.assert_phase_2e_admin(p_actor_id, p_city_id, false);
            if jsonb_typeof(p_patch) <> 'object' then raise exception 'ADMIN_SERVICE_ZONE_INVALID'; end if;
            v_resource_id := coalesce(p_zone_id, p_idempotency_key);"""
          replacement = """  perform private.assert_phase_2e_admin(p_actor_id, p_city_id, false);
            if jsonb_typeof(p_patch) <> 'object' then raise exception 'ADMIN_SERVICE_ZONE_INVALID'; end if;
            if p_patch ->> 'status' = 'ACTIVE' then raise exception 'ADMIN_SERVICE_ZONE_ACTIVATION_REQUIRES_CITY_PREFLIGHT'; end if;
            v_resource_id := coalesce(p_zone_id, p_idempotency_key);"""
          if needle not in source:
              raise SystemExit('zone activation guard block not found')
          source = source.replace(needle, replacement)

          source = source.replace(
              "when invalid_text_representation or numeric_value_out_of_range then\n    raise exception 'ADMIN_CITY_CONFIGURATION_INVALID';",
              "when invalid_text_representation or numeric_value_out_of_range or not_null_violation or check_violation then\n    raise exception 'ADMIN_CITY_CONFIGURATION_INVALID';",
          )

          needle = """    update public.service_zones
              set status = 'ACTIVE', version = version + 1, updated_by = p_actor_id
              where city_id = p_city_id
                and status in ('READY_FOR_VALIDATION', 'PAUSED');
            end if;"""
          replacement = """    update public.service_zones
              set status = 'ACTIVE', version = version + 1, updated_by = p_actor_id
              where city_id = p_city_id
                and status in ('READY_FOR_VALIDATION', 'PAUSED');

              update public.merchant_branches mb
              set status = 'ACTIVE', updated_by = p_actor_id
              from public.shops shop, public.merchant_profiles merchant, public.profiles merchant_profile
              where mb.city_id = p_city_id
                and mb.status = 'APPROVED'
                and mb.verification_status = 'VERIFIED'
                and mb.geography_status = 'VERIFIED'
                and mb.local_delivery_enabled
                and shop.id = mb.shop_id
                and shop.deleted_at is null
                and shop.verification_status = 'VERIFIED'
                and shop.operational_status not in ('PAUSED', 'SUSPENDED')
                and merchant.user_id = mb.merchant_id
                and merchant.kyc_status = 'VERIFIED'
                and merchant.onboarding_status = 'ACTIVE'
                and merchant_profile.id = mb.merchant_id
                and merchant_profile.status = 'ACTIVE';
            end if;"""
          if needle not in source:
              raise SystemExit('city activation block not found')
          source = source.replace(needle, replacement)

          path.write_text(source)
          PY
          git diff --check
          git diff --exit-code --quiet && { echo 'Expected database corrections were not applied'; exit 1; }
      - name: Commit production correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Vastra Phase 2E Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/migrations/20260728113000_phase_2e_city_activation.sql
          git commit -m 'fix(db): harden Phase 2E activation contracts'
          git push origin HEAD:agent/phase-2e-city-activation

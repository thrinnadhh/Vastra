name: Apply Phase 2E database hardening

on:
  push:
    branches:
      - agent/phase-2e-city-activation
    paths:
      - .github/workflows/phase-2e-apply-db-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Phase 2E branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/phase-2e-city-activation
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed database corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260728113000_phase_2e_city_activation.sql')
          source = path.read_text()

          replacements = [
              (
                  "      'CONFIGURATION',\n      'CITY',",
                  "      'CONFIGURATION',\n      'PAYMENT',\n      'PAYMENT_EVENT',\n      'RETURN_REQUEST',\n      'REFUND',\n      'MERCHANT_SETTLEMENT',\n      'CAPTAIN_EARNING',\n      'CAPTAIN_PAYOUT',\n      'COD_RECONCILIATION',\n      'CITY',",
              ),
              (
                  "from jsonb_object_keys(p_patch) as key\n  where key not in (",
                  "from jsonb_object_keys(p_patch) as patch_key(key)\n  where key not in (",
              ),
              (
                  "v_resource_id := coalesce(p_zone_id, gen_random_uuid());",
                  "v_resource_id := coalesce(p_zone_id, p_idempotency_key);",
              ),
              (
                  "v_resource_id uuid := coalesce(p_mapping_id, gen_random_uuid());",
                  "v_resource_id uuid := coalesce(p_mapping_id, p_idempotency_key);",
              ),
              (
                  "z.status in ('READY_FOR_VALIDATION', 'ACTIVE')",
                  "z.status in ('READY_FOR_VALIDATION', 'ACTIVE', 'PAUSED')",
              ),
              (
                  "when invalid_text_representation or numeric_value_out_of_range then\n    raise exception 'ADMIN_CITY_CONFIGURATION_INVALID';",
                  "when invalid_text_representation or numeric_value_out_of_range or not_null_violation or check_violation then\n    raise exception 'ADMIN_CITY_CONFIGURATION_INVALID';",
              ),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'required correction target not found: {old[:60]}')
              source = source.replace(old, new)

          merchant_count_old = (
              "  from public.merchant_branches mb\n"
              "  where mb.city_id = p_city_id\n"
              "    and mb.status = 'ACTIVE'\n"
              "    and mb.verification_status = 'VERIFIED'\n"
              "    and mb.geography_status = 'VERIFIED'\n"
              "    and mb.local_delivery_enabled;"
          )
          merchant_count_new = (
              "  from public.merchant_branches mb\n"
              "  join public.shops shop on shop.id = mb.shop_id\n"
              "  join public.merchant_profiles merchant on merchant.user_id = mb.merchant_id\n"
              "  join public.profiles merchant_profile on merchant_profile.id = mb.merchant_id\n"
              "  where mb.city_id = p_city_id\n"
              "    and mb.status in ('APPROVED', 'ACTIVE')\n"
              "    and mb.verification_status = 'VERIFIED'\n"
              "    and mb.geography_status = 'VERIFIED'\n"
              "    and mb.local_delivery_enabled\n"
              "    and shop.deleted_at is null\n"
              "    and shop.verification_status = 'VERIFIED'\n"
              "    and shop.operational_status not in ('PAUSED', 'SUSPENDED')\n"
              "    and merchant.kyc_status = 'VERIFIED'\n"
              "    and merchant.onboarding_status = 'ACTIVE'\n"
              "    and merchant_profile.status = 'ACTIVE';"
          )
          if merchant_count_old not in source:
              raise SystemExit('merchant readiness block not found')
          source = source.replace(merchant_count_old, merchant_count_new)

          coverage_old = (
              "      from public.merchant_branches mb\n"
              "      left join public.branch_service_zones bsz\n"
              "        on bsz.branch_id = mb.id\n"
              "       and bsz.city_id = mb.city_id\n"
              "       and bsz.is_active\n"
              "      where mb.city_id = p_city_id\n"
              "        and mb.status = 'ACTIVE'\n"
              "        and mb.verification_status = 'VERIFIED'\n"
              "        and mb.geography_status = 'VERIFIED'\n"
              "        and mb.local_delivery_enabled\n"
              "        and ("
          )
          coverage_new = (
              "      from public.merchant_branches mb\n"
              "      join public.shops shop on shop.id = mb.shop_id\n"
              "      join public.merchant_profiles merchant on merchant.user_id = mb.merchant_id\n"
              "      join public.profiles merchant_profile on merchant_profile.id = mb.merchant_id\n"
              "      left join public.branch_service_zones bsz\n"
              "        on bsz.branch_id = mb.id\n"
              "       and bsz.city_id = mb.city_id\n"
              "       and bsz.is_active\n"
              "      where mb.city_id = p_city_id\n"
              "        and mb.status in ('APPROVED', 'ACTIVE')\n"
              "        and mb.verification_status = 'VERIFIED'\n"
              "        and mb.geography_status = 'VERIFIED'\n"
              "        and mb.local_delivery_enabled\n"
              "        and shop.deleted_at is null\n"
              "        and shop.verification_status = 'VERIFIED'\n"
              "        and shop.operational_status not in ('PAUSED', 'SUSPENDED')\n"
              "        and merchant.kyc_status = 'VERIFIED'\n"
              "        and merchant.onboarding_status = 'ACTIVE'\n"
              "        and merchant_profile.status = 'ACTIVE'\n"
              "        and ("
          )
          if coverage_old not in source:
              raise SystemExit('merchant coverage block not found')
          source = source.replace(coverage_old, coverage_new)

          zone_guard_old = (
              "  perform private.assert_phase_2e_admin(p_actor_id, p_city_id, false);\n"
              "  if jsonb_typeof(p_patch) <> 'object' then raise exception 'ADMIN_SERVICE_ZONE_INVALID'; end if;\n"
              "  v_resource_id := coalesce(p_zone_id, p_idempotency_key);"
          )
          zone_guard_new = (
              "  perform private.assert_phase_2e_admin(p_actor_id, p_city_id, false);\n"
              "  if jsonb_typeof(p_patch) <> 'object' then raise exception 'ADMIN_SERVICE_ZONE_INVALID'; end if;\n"
              "  if p_patch ->> 'status' = 'ACTIVE' then raise exception 'ADMIN_SERVICE_ZONE_ACTIVATION_REQUIRES_CITY_PREFLIGHT'; end if;\n"
              "  v_resource_id := coalesce(p_zone_id, p_idempotency_key);"
          )
          if zone_guard_old not in source:
              raise SystemExit('zone activation guard block not found')
          source = source.replace(zone_guard_old, zone_guard_new)

          activation_old = (
              "    update public.service_zones\n"
              "    set status = 'ACTIVE', version = version + 1, updated_by = p_actor_id\n"
              "    where city_id = p_city_id\n"
              "      and status in ('READY_FOR_VALIDATION', 'PAUSED');\n"
              "  end if;"
          )
          activation_new = (
              "    update public.service_zones\n"
              "    set status = 'ACTIVE', version = version + 1, updated_by = p_actor_id\n"
              "    where city_id = p_city_id\n"
              "      and status in ('READY_FOR_VALIDATION', 'PAUSED');\n\n"
              "    update public.merchant_branches mb\n"
              "    set status = 'ACTIVE', updated_by = p_actor_id\n"
              "    from public.shops shop, public.merchant_profiles merchant, public.profiles merchant_profile\n"
              "    where mb.city_id = p_city_id\n"
              "      and mb.status = 'APPROVED'\n"
              "      and mb.verification_status = 'VERIFIED'\n"
              "      and mb.geography_status = 'VERIFIED'\n"
              "      and mb.local_delivery_enabled\n"
              "      and shop.id = mb.shop_id\n"
              "      and shop.deleted_at is null\n"
              "      and shop.verification_status = 'VERIFIED'\n"
              "      and shop.operational_status not in ('PAUSED', 'SUSPENDED')\n"
              "      and merchant.user_id = mb.merchant_id\n"
              "      and merchant.kyc_status = 'VERIFIED'\n"
              "      and merchant.onboarding_status = 'ACTIVE'\n"
              "      and merchant_profile.id = mb.merchant_id\n"
              "      and merchant_profile.status = 'ACTIVE';\n"
              "  end if;"
          )
          if activation_old not in source:
              raise SystemExit('city activation block not found')
          source = source.replace(activation_old, activation_new)

          path.write_text(source)
          PY
          git diff --check
          git diff --exit-code --quiet && { echo 'Expected database corrections were not applied'; exit 1; }
      - name: Commit production correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Vastra Phase 2E Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/migrations/20260728113000_phase_2e_city_activation.sql
          git commit -m 'fix(db): harden Phase 2E activation contracts'
          git push origin HEAD:agent/phase-2e-city-activation

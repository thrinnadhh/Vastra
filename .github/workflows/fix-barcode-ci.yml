name: Fix barcode CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply final barcode repairs
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              source = file.read_text()
              if old in source:
                  file.write_text(source.replace(old, new, count))
                  return
              if new in source:
                  return
              raise SystemExit(f'Missing expected repair pattern in {path}: {old[:120]!r}')

          app_test = 'apps/merchant-app/App.test.tsx'
          replace(
              app_test,
              "jest.requireActual<typeof import('react-native')>('react-native')",
              "jest.requireActual('react-native')",
              2,
          )
          replace(app_test, "import type * as ReactNative from 'react-native';\n", '', 1)

          packing_test = 'apps/merchant-app/src/orders/merchant-order-packing.scanner.test.tsx'
          replace(
              packing_test,
              "jest.requireActual<typeof import('react-native')>('react-native')",
              "jest.requireActual('react-native')",
          )
          replace(packing_test, "import type * as ReactNative from 'react-native';\n", '', 1)

          call_helper = """function firstCall<T extends readonly unknown[]>(calls: readonly T[]): T {
            const call = calls[0];
            if (call === undefined) {
              throw new TypeError('Expected one mock call');
            }
            return call;
          }

          """

          client_test = 'apps/merchant-app/src/inventory/merchant-inventory.client.test.ts'
          replace(
              client_test,
              "type TestFetchFunction = (input: string, init: RequestInit) => Promise<TestResponse>;\n\n",
              "type TestFetchFunction = (input: string, init: RequestInit) => Promise<TestResponse>;\n\n" + call_helper,
          )
          replace(
              client_test,
              'const [url, init] = fetchFunction.mock.calls[0]!;',
              'const [url, init] = firstCall(fetchFunction.mock.calls);',
              2,
          )

          screen_test = 'apps/merchant-app/src/inventory/merchant-inventory.screen.test.tsx'
          replace(
              screen_test,
              "const IDEMPOTENCY_KEY = '80000000-0000-4000-8000-000000000001';\n\n",
              "const IDEMPOTENCY_KEY = '80000000-0000-4000-8000-000000000001';\n\n" + call_helper,
          )
          replace(
              screen_test,
              'const [saleInput, idempotencyKey] = client.createOfflineSale.mock.calls[0]!;',
              'const [saleInput, idempotencyKey] = firstCall(client.createOfflineSale.mock.calls);',
          )
          replace(
              screen_test,
              'const queued = offlineQueue.enqueue.mock.calls[0]![0];',
              'const [queued] = firstCall(offlineQueue.enqueue.mock.calls);',
          )

          screen_path = Path('apps/merchant-app/src/inventory/merchant-inventory.screen.tsx')
          source = screen_path.read_text()

          anchor = """function asInventoryError(error: unknown): MerchantInventoryError {
            return error instanceof MerchantInventoryError
              ? error
              : new MerchantInventoryError('UNKNOWN', null, false);
          }

          """
          helpers = anchor + """function isMounted(ref: { readonly current: boolean }): boolean {
            return ref.current;
          }

          function inventoryRefreshTarget(
            shop: MerchantShopSummary | null,
            inventory: MerchantBarcodeInventory | null,
          ): { readonly shopId: string; readonly barcode: string } | null {
            if (shop === null || inventory === null) return null;
            return { shopId: shop.id, barcode: inventory.scannedBarcode };
          }

          """
          if 'function isMounted(' not in source:
              if anchor not in source:
                  raise SystemExit('Missing inventory helper anchor')
              source = source.replace(anchor, helpers, 1)
          elif 'function inventoryRefreshTarget(' not in source:
              mounted_helper = """function isMounted(ref: { readonly current: boolean }): boolean {
            return ref.current;
          }

          """
              target_helper = mounted_helper + """function inventoryRefreshTarget(
            shop: MerchantShopSummary | null,
            inventory: MerchantBarcodeInventory | null,
          ): { readonly shopId: string; readonly barcode: string } | null {
            if (shop === null || inventory === null) return null;
            return { shopId: shop.id, barcode: inventory.scannedBarcode };
          }

          """
              if mounted_helper not in source:
                  raise SystemExit('Missing mounted helper for refresh target')
              source = source.replace(mounted_helper, target_helper, 1)

          source = source.replace('if (!mounted.current) return;', 'if (!isMounted(mounted)) return;')

          old_shop = """      if (shops.length === 0) {
            setShop(null);
            setFailure(new MerchantInventoryError('NOT_FOUND', 'SHOP_NOT_FOUND', false));
          } else {
            setShop(shops[0] ?? null);
          }"""
          new_shop = """      const [firstShop] = shops;
          if (firstShop === undefined) {
            setShop(null);
            setFailure(new MerchantInventoryError('NOT_FOUND', 'SHOP_NOT_FOUND', false));
          } else {
            setShop(firstShop);
          }"""
          if old_shop in source:
              source = source.replace(old_shop, new_shop, 1)
          elif new_shop not in source:
              raise SystemExit('Missing owned-shop branch')

          source = source.replace(
              'entry.pending.input.items[0]?.variantId === inventory.variant.id',
              'entry.pending.input.items[0].variantId === inventory.variant.id',
              1,
          )
          source = source.replace(
              '  useEffect(() => {\n    void loadShop();\n  }, [loadShop]);',
              '  useEffect(() => {\n    void Promise.resolve().then(loadShop);\n  }, [loadShop]);',
              1,
          )

          old_queue_catch = """        } catch {
            if (mounted.current) {
              setFailure(new MerchantInventoryError('UNKNOWN', 'OFFLINE_QUEUE_UNAVAILABLE', false));
            }
            return;
          }"""
          new_queue_catch = """        } catch {
            if (!isMounted(mounted)) return;
            setFailure(new MerchantInventoryError('UNKNOWN', 'OFFLINE_QUEUE_UNAVAILABLE', false));
            return;
          }"""
          if old_queue_catch in source:
              source = source.replace(old_queue_catch, new_queue_catch, 1)

          source = source.replace(
              """      } else if (mounted.current) {
            setFailure(inventoryError);
          }""",
              """      } else {
            if (!isMounted(mounted)) return;
            setFailure(inventoryError);
          }""",
              1,
          )

          old_remove = """      if (shop !== null && inventory !== null) {
            try {
              const refreshed = await client.lookupBarcode(shop.id, inventory.scannedBarcode);
              if (!mounted.current) return;
              setInventory(refreshed);
              setUsingCachedInventory(false);
              try {
                await cache.put(shop.id, refreshed);
              } catch {
                // The refreshed server value remains valid for this session.
              }
              setNotice('Pending offline sale removed and inventory refreshed.');
              return;
            } catch {
              // The command is removed even when the device is still offline. The
              // last safe cached balance remains visible until the next lookup.
            }
          }

          if (mounted.current) {
            setNotice(
              'Pending offline sale removed. Refresh the barcode before recording another sale.',
            );
          }"""
          new_remove = """      const target = inventoryRefreshTarget(shop, inventory);
          if (target !== null) {
            try {
              const refreshed = await client.lookupBarcode(target.shopId, target.barcode);
              if (!isMounted(mounted)) return;
              setInventory(refreshed);
              setUsingCachedInventory(false);
              try {
                await cache.put(target.shopId, refreshed);
              } catch {
                // The refreshed server value remains valid for this session.
              }
              setNotice('Pending offline sale removed and inventory refreshed.');
              return;
            } catch {
              // The command is removed even when the device is still offline. The
              // last safe cached balance remains visible until the next lookup.
            }
          }

          if (!isMounted(mounted)) return;
          setNotice(
            'Pending offline sale removed. Refresh the barcode before recording another sale.',
          );"""
          if old_remove in source:
              source = source.replace(old_remove, new_remove, 1)
          elif new_remove not in source:
              # Replace the intermediate worktree shape from prior repair attempts.
              start = source.find('      const currentShop = shop;')
              end_marker = """      if (!isMounted(mounted)) return;
          setNotice(
            'Pending offline sale removed. Refresh the barcode before recording another sale.',
          );"""
              end = source.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('Missing pending-sale refresh block')
              source = source[:start] + new_remove + source[end + len(end_marker):]

          source = source.replace(
              'entry.input.items[0]?.quantity ?? 0',
              'entry.input.items[0].quantity',
              1,
          )

          old_client = """  const client = useMemo(
            () => new HttpMerchantInventoryClient(session.apiBaseUrl, session.getAccessToken),
            [session.apiBaseUrl, session.getAccessToken],
          );"""
          new_client = """  const client = useMemo(
            () =>
              new HttpMerchantInventoryClient(session.apiBaseUrl, () =>
                session.getAccessToken(),
              ),
            [session],
          );"""
          if old_client in source:
              source = source.replace(old_client, new_client, 1)
          elif new_client not in source:
              raise SystemExit('Missing default inventory client block')

          screen_path.write_text(source)
          PY

      - name: Format repaired files
        run: |
          pnpm exec prettier --write \
            apps/merchant-app/App.test.tsx \
            apps/merchant-app/src/barcode/merchant-barcode-scanner.tsx \
            apps/merchant-app/src/inventory/merchant-inventory.cache.ts \
            apps/merchant-app/src/inventory/merchant-inventory.client.test.ts \
            apps/merchant-app/src/inventory/merchant-inventory.screen.test.tsx \
            apps/merchant-app/src/inventory/merchant-inventory.screen.tsx \
            apps/merchant-app/src/inventory/merchant-offline-sale.queue.ts \
            apps/merchant-app/src/orders/merchant-order-packing.scanner.test.tsx

      - name: Validate merchant barcode slice
        run: |
          pnpm --filter @vastra/merchant-app lint
          pnpm --filter @vastra/merchant-app typecheck
          pnpm --filter @vastra/merchant-app test

      - name: Commit repairs and remove temporary workflow
        run: |
          rm .github/workflows/fix-barcode-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy barcode lint and tests"
          git push

name: Fix barcode CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply reviewed source overlay
        run: |
          echo '[... ELLIPSIZATION ...]' | base64 -d | tar -xzf -

      - name: Format repaired files
        run: |
          pnpm exec prettier --write \
            apps/merchant-app/App.test.tsx \
            apps/merchant-app/src/barcode/merchant-barcode-scanner.tsx \
            apps/merchant-app/src/inventory/merchant-inventory.cache.ts \
            apps/merchant-app/src/inventory/merchant-inventory.client.test.ts \
            apps/merchant-app/src/inventory/merchant-inventory.screen.test.tsx \
            apps/merchant-app/src/inventory/merchant-inventory.screen.tsx \
            apps/merchant-app/src/inventory/merchant-offline-sale.queue.ts \
            apps/merchant-app/src/orders/merchant-order-packing.scanner.test.tsx

      - name: Commit repairs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/merchant-app
          git commit -m "fix: satisfy barcode lint and tests"
          git push

      - name: Validate merchant barcode slice
        run: |
          pnpm --filter @vastra/merchant-app lint
          pnpm --filter @vastra/merchant-app typecheck
          pnpm --filter @vastra/merchant-app test

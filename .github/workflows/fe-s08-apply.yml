name: FE-S08 apply validated backend implementation

on:
  push:
    branches:
      - agent/fe-s08-backend-implementation
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fe-s08-apply-backend-implementation
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' || github.head_ref == 'agent/fe-s08-backend-implementation')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: agent/fe-s08-backend-implementation
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Decode prepared implementation
        run: |
          mkdir -p /tmp/fe-s08-diagnostics
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          paths = sorted(Path('.github/fe-s08-patch').glob('chunk-*'))
          if not paths:
              raise SystemExit('No FE-S08 patch chunks found')

          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in paths)
          raw = base64.b64decode(encoded, validate=True)
          patch = gzip.decompress(raw)
          Path('/tmp/fe-s08.patch').write_bytes(patch)
          Path('/tmp/fe-s08-diagnostics/decode.txt').write_text(
              f'chunks={len(paths)}\nencoded_bytes={len(encoded)}\ncompressed_bytes={len(raw)}\npatch_bytes={len(patch)}\n',
              encoding='utf-8',
          )
          PY
          test -s /tmp/fe-s08.patch
          sed -n '1,120p' /tmp/fe-s08.patch > /tmp/fe-s08-diagnostics/patch-head.txt

      - name: Check prepared patch
        run: |
          set +e
          git apply --check /tmp/fe-s08.patch > /tmp/fe-s08-diagnostics/apply-check.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat /tmp/fe-s08-diagnostics/apply-check.log
            exit "$status"
          fi

      - name: Apply implementation and remove temporary transport files
        run: |
          git apply /tmp/fe-s08.patch
          rm -rf .github/fe-s08-patch
          rm -f .github/workflows/fe-s08-materialize.yml
          rm -f .github/workflows/fe-s08-apply.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository formatting
        run: pnpm format

      - name: Validate static quality
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck

      - name: Validate backend and contracts
        run: |
          pnpm --filter @vastra/backend test
          pnpm --filter @vastra/backend test:integration
          pnpm openapi:check
          pnpm --filter @vastra/backend build

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(fe-s08): implement admin observation and recovery backend"
          git push origin HEAD:agent/fe-s08-backend-implementation

      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fe-s08-recovery-diagnostics
          path: /tmp/fe-s08-diagnostics
          if-no-files-found: warn
          retention-days: 1

name: FE-S08 apply validated backend implementation

on:
  push:
    branches:
      - agent/fe-s08-backend-implementation
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fe-s08-apply-backend-implementation
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' || github.head_ref == 'agent/fe-s08-backend-implementation')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: agent/fe-s08-backend-implementation
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Decode prepared implementation
        run: |
          mkdir -p /tmp/fe-s08-diagnostics
          touch /tmp/fe-s08-diagnostics/started.txt
          set +e
          python3 - <<'PY' > /tmp/fe-s08-diagnostics/decode.stdout 2> /tmp/fe-s08-diagnostics/decode.stderr
          from pathlib import Path
          import base64
          import gzip
          import traceback

          diagnostics = Path('/tmp/fe-s08-diagnostics')
          paths = sorted(Path('.github/fe-s08-patch').glob('chunk-*'))
          lengths = []
          pieces = []
          for path in paths:
              text = path.read_text(encoding='utf-8').strip()
              pieces.append(text)
              lengths.append((path.name, len(text), text[:16], text[-16:]))

          encoded = ''.join(pieces)
          diagnostics.joinpath('chunk-summary.txt').write_text(
              '\n'.join(
                  [f'chunks={len(paths)}', f'encoded_bytes={len(encoded)}', f'encoded_mod4={len(encoded) % 4}']
                  + [f'{name}: bytes={size} first={first} last={last}' for name, size, first, last in lengths]
              ) + '\n',
              encoding='utf-8',
          )

          try:
              padded = encoded + ('=' * (-len(encoded) % 4))
              raw = base64.b64decode(padded, validate=False)
              diagnostics.joinpath('compressed-summary.txt').write_text(
                  f'compressed_bytes={len(raw)}\nmagic={raw[:8].hex()}\n',
                  encoding='utf-8',
              )
              patch = gzip.decompress(raw)
              Path('/tmp/fe-s08.patch').write_bytes(patch)
              diagnostics.joinpath('decode.txt').write_text(
                  f'patch_bytes={len(patch)}\n',
                  encoding='utf-8',
              )
          except Exception:
              diagnostics.joinpath('exception.txt').write_text(traceback.format_exc(), encoding='utf-8')
              raise
          PY
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat /tmp/fe-s08-diagnostics/chunk-summary.txt || true
            cat /tmp/fe-s08-diagnostics/compressed-summary.txt || true
            cat /tmp/fe-s08-diagnostics/exception.txt || true
            exit "$status"
          fi
          test -s /tmp/fe-s08.patch
          sed -n '1,120p' /tmp/fe-s08.patch > /tmp/fe-s08-diagnostics/patch-head.txt

      - name: Check prepared patch
        run: |
          set +e
          git apply --check /tmp/fe-s08.patch > /tmp/fe-s08-diagnostics/apply-check.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat /tmp/fe-s08-diagnostics/apply-check.log
            exit "$status"
          fi

      - name: Apply implementation and remove temporary transport files
        run: |
          git apply /tmp/fe-s08.patch
          rm -rf .github/fe-s08-patch
          rm -f .github/workflows/fe-s08-materialize.yml
          rm -f .github/workflows/fe-s08-apply.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository formatting
        run: pnpm format

      - name: Validate static quality
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck

      - name: Validate backend and contracts
        run: |
          pnpm --filter @vastra/backend test
          pnpm --filter @vastra/backend test:integration
          pnpm openapi:check
          pnpm --filter @vastra/backend build

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(fe-s08): implement admin observation and recovery backend"
          git push origin HEAD:agent/fe-s08-backend-implementation

      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fe-s08-recovery-diagnostics
          path: /tmp/fe-s08-diagnostics
          if-no-files-found: error
          retention-days: 1

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-contracts:
    name: Database and OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Phase 2C branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/phase-2c-serviceability-catalogue
          persist-credentials: true

      - name: Apply composite-row migration fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260727180000_city_aware_serviceability.sql')
          text = path.read_text()
          old = '''  select
            c.id,
            c.status,
            sz.id,
            sz.status,
            cc
          into
            v_city_id,
            v_city_status,
            v_service_zone_id,
            v_zone_status,
            v_configuration
          from public.service_zone_pincodes szp
          join public.cities c
            on c.id = szp.city_id
          join public.service_zones sz
            on sz.id = szp.service_zone_id
           and sz.city_id = c.id
          join public.city_configurations cc
            on cc.city_id = c.id
          where szp.pincode = p_pincode
            and szp.is_active
            and c.status = 'ACTIVE'
            and sz.status = 'ACTIVE'
            and (
              sz.boundary is null
              or extensions.st_covers(sz.boundary, v_point)
            )
          order by
            szp.is_primary desc,
            szp.priority,
            c.id,
            sz.id
          limit 1;

          if found then
            return jsonb_build_object('''
          new = '''  select
            c.id,
            c.status,
            sz.id,
            sz.status
          into
            v_city_id,
            v_city_status,
            v_service_zone_id,
            v_zone_status
          from public.service_zone_pincodes szp
          join public.cities c
            on c.id = szp.city_id
          join public.service_zones sz
            on sz.id = szp.service_zone_id
           and sz.city_id = c.id
          join public.city_configurations cc
            on cc.city_id = c.id
          where szp.pincode = p_pincode
            and szp.is_active
            and c.status = 'ACTIVE'
            and sz.status = 'ACTIVE'
            and (
              sz.boundary is null
              or extensions.st_covers(sz.boundary, v_point)
            )
          order by
            szp.is_primary desc,
            szp.priority,
            c.id,
            sz.id
          limit 1;

          if found then
            select *
            into strict v_configuration
            from public.city_configurations cc
            where cc.city_id = v_city_id;

            return jsonb_build_object('''
          if old not in text:
              raise SystemExit('expected composite-row pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY

          git config user.name 'vastra-ci'
          git config user.email 'vastra-ci@users.noreply.github.com'
          git add supabase/migrations/20260727180000_city_aware_serviceability.sql
          git commit -m 'fix(db): load city configuration separately'
          git push origin HEAD:agent/phase-2c-serviceability-catalogue

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.109.1

      - name: Run database tests with complete capture
        id: database
        shell: bash
        run: |
          set +e
          pnpm db:test > /tmp/phase2c-database.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 250 /tmp/phase2c-database.log
          exit 0

      - name: Upload database diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase2c-database-diagnostics-${{ github.run_attempt }}
          path: /tmp/phase2c-database.log
          if-no-files-found: error
          retention-days: 2

      - name: Preserve database result
        env:
          DATABASE_STATUS: ${{ steps.database.outputs.status }}
        run: test "$DATABASE_STATUS" = "0"

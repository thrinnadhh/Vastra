name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-ci:
    name: Restore repository CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Phase 2C branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/phase-2c-serviceability-catalogue
          persist-credentials: true
          fetch-depth: 0

      - name: Restore main CI and remove diagnostics
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f .github/workflows/phase2c-database-diagnostics.yml
          git config user.name 'vastra-ci'
          git config user.email 'vastra-ci@users.noreply.github.com'
          git commit -m 'chore(ci): remove Phase 2C diagnostics'
          git push origin HEAD:agent/phase-2c-serviceability-catalogue

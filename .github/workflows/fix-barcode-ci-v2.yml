name: Fix barcode CI v2

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run anchored reviewed repair
        run: |
          python <<'BOOT'
          from pathlib import Path
          import re
          import textwrap

          packing_path = Path(
              'apps/merchant-app/src/orders/merchant-order-packing.scanner.test.tsx'
          )
          packing = packing_path.read_text()
          if "import { Pressable, Text } from 'react-native';" not in packing:
              packing = packing.replace(
                  "import { fireEvent, render } from '@testing-library/react-native';\n",
                  "import { fireEvent, render } from '@testing-library/react-native';\n"
                  "import { Pressable, Text } from 'react-native';\n",
                  1,
              )
          mock = """function MockMerchantBarcodeScanner({
            visible,
            onScanned,
          }: {
            readonly visible: boolean;
            readonly onScanned: (value: string) => void;
          }) {
            return visible ? (
              <Pressable
                accessibilityLabel="Emit test packing barcode"
                onPress={() => {
                  onScanned('CORRECT-1');
                }}
              >
                <Text>Test scanner</Text>
              </Pressable>
            ) : null;
          }

          jest.mock('../barcode/merchant-barcode-scanner', () => ({
            MerchantBarcodeScanner: MockMerchantBarcodeScanner,
          }));

          const ORDER_ID"""
          packing, count = re.subn(
              r"jest\.mock\('\.\./barcode/merchant-barcode-scanner', \(\) => \{.*?\n\}\);\n\nconst ORDER_ID",
              mock,
              packing,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1 and 'MerchantBarcodeScanner: MockMerchantBarcodeScanner' not in packing:
              raise SystemExit('Packing scanner mock was not replaced')
          packing = packing.replace(
              "startPacking: jest.fn(() => Promise.reject(new Error('unused'))),",
              """startPacking: jest.fn<
                ReturnType<MerchantOrderPackingPort['startPacking']>,
                Parameters<MerchantOrderPackingPort['startPacking']>
              >(() => Promise.reject(new Error('unused'))),""",
              1,
          )
          packing = packing.replace(
              'verifyPackingItem: jest.fn(() =>',
              """verifyPackingItem: jest.fn<
                ReturnType<MerchantOrderPackingPort['verifyPackingItem']>,
                Parameters<MerchantOrderPackingPort['verifyPackingItem']>
              >(() =>""",
              1,
          )
          packing = packing.replace(
              "markReadyForPickup: jest.fn(() => Promise.reject(new Error('unused'))),",
              """markReadyForPickup: jest.fn<
                ReturnType<MerchantOrderPackingPort['markReadyForPickup']>,
                Parameters<MerchantOrderPackingPort['markReadyForPickup']>
              >(() => Promise.reject(new Error('unused'))),""",
              1,
          )
          packing_path.write_text(packing)

          screen_test_path = Path(
              'apps/merchant-app/src/inventory/merchant-inventory.screen.test.tsx'
          )
          screen_test = screen_test_path.read_text()
          screen_test = screen_test.replace(
              'lookupBarcode: jest.fn(() => Promise.resolve(inventory)),',
              """lookupBarcode: jest.fn<
                ReturnType<MerchantInventoryPort['lookupBarcode']>,
                Parameters<MerchantInventoryPort['lookupBarcode']>
              >(() => Promise.resolve(inventory)),""",
              1,
          )
          screen_test = screen_test.replace(
              'createOfflineSale: jest.fn(() =>',
              """createOfflineSale: jest.fn<
                ReturnType<MerchantInventoryPort['createOfflineSale']>,
                Parameters<MerchantInventoryPort['createOfflineSale']>
              >(() =>""",
              1,
          )
          screen_test = screen_test.replace(
              'remove: jest.fn(() => Promise.resolve([])),',
              """remove: jest.fn<
                ReturnType<MerchantOfflineSaleQueuePort['remove']>,
                Parameters<MerchantOfflineSaleQueuePort['remove']>
              >(() => Promise.resolve([])),""",
              1,
          )
          screen_test = screen_test.replace(
              'sync: jest.fn(() => Promise.resolve({ remaining: [], completed: [] })),',
              """sync: jest.fn<
                ReturnType<MerchantOfflineSaleQueuePort['sync']>,
                Parameters<MerchantOfflineSaleQueuePort['sync']>
              >(() => Promise.resolve({ remaining: [], completed: [] })),""",
              1,
          )
          screen_test = screen_test.replace(
              'get: jest.fn(() => Promise.resolve(cached)),',
              """get: jest.fn<
                ReturnType<MerchantInventoryCachePort['get']>,
                Parameters<MerchantInventoryCachePort['get']>
              >(() => Promise.resolve(cached)),""",
              1,
          )
          screen_test = screen_test.replace(
              'put: jest.fn(() => Promise.resolve()),',
              """put: jest.fn<
                ReturnType<MerchantInventoryCachePort['put']>,
                Parameters<MerchantInventoryCachePort['put']>
              >(() => Promise.resolve()),""",
              1,
          )
          screen_test_path.write_text(screen_test)

          workflow = Path('.github/workflows/fix-barcode-ci.yml').read_text()
          marker = "python <<'PY'\n"
          script = workflow.split(marker, 1)[1].split('\n          PY', 1)[0]
          script = textwrap.dedent(script)
          script = re.sub(
              r"\ntransform\('apps/merchant-app/App\.test\.tsx', test_factory\)\n",
              '\n',
              script,
              count=1,
          )
          script = re.sub(
              r"\ntransform\(\n\s*'apps/merchant-app/src/orders/merchant-order-packing\.scanner\.test\.tsx',\n\s*test_factory,\n\)\n",
              '\n',
              script,
              count=1,
          )
          old = """remove_start = source.find('      if (shop !== null && inventory !== null) {')
          if remove_start < 0:
              remove_start = source.find('      const currentShop = shop;')
          """
          new = """remove_callback = source.find('  const removePendingSale = useCallback(')
          remove_start = source.find(
              '      if (shop !== null && inventory !== null) {',
              remove_callback,
          )
          if remove_start < 0:
              remove_start = source.find('      const currentShop = shop;', remove_callback)
          """
          if old not in script:
              raise SystemExit('Ambiguous pending-sale matcher was not found')
          script = script.replace(old, new, 1)
          exec(compile(script, 'barcode-repair.py', 'exec'))
          BOOT

      - name: Format repaired files
        run: |
          pnpm exec prettier --write \
            apps/merchant-app/App.test.tsx \
            apps/merchant-app/src/barcode/merchant-barcode-scanner.tsx \
            apps/merchant-app/src/inventory/merchant-inventory.cache.ts \
            apps/merchant-app/src/inventory/merchant-inventory.client.test.ts \
            apps/merchant-app/src/inventory/merchant-inventory.screen.test.tsx \
            apps/merchant-app/src/inventory/merchant-inventory.screen.tsx \
            apps/merchant-app/src/inventory/merchant-offline-sale.queue.ts \
            apps/merchant-app/src/orders/merchant-order-packing.scanner.test.tsx

      - name: Validate merchant barcode slice
        run: |
          pnpm --filter @vastra/api-client build
          pnpm --filter @vastra/merchant-app lint
          pnpm --filter @vastra/merchant-app typecheck
          pnpm --filter @vastra/merchant-app test

      - name: Commit repairs and remove temporary workflows
        run: |
          rm .github/workflows/fix-barcode-ci.yml
          rm .github/workflows/fix-barcode-ci-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy barcode lint and tests"
          git push

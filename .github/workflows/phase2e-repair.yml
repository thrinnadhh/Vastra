      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed TypeScript, OpenAPI and documentation
        run: >-
          pnpm exec prettier --write
          apps/admin-dashboard/src/app/cities/page.tsx
          apps/backend/src/admin/admin-city.gateway.ts
          apps/backend/src/admin/admin-city.gateway.test.ts
          docs/api/openapi.yaml
          docs/implementation/phase-2e-merge-blockers-bug-fix.md

      - name: Run focused backend regression
        run: pnpm --filter @vastra/backend test -- admin-city.gateway.test.ts

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.109.1

      - name: Run full database workflow
        env:
          DB_TEST_DIAGNOSTICS_DIR: /tmp/vastra-db-test-diagnostics
        run: pnpm db:test

      - name: Validate OpenAPI and generated client
        run: |
          pnpm openapi:check
          pnpm --filter @vastra/api-client contract:check

      - name: Commit repaired branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase2e-repair.yml
          git add \
            apps/admin-dashboard/src/app/cities/page.tsx \
            apps/backend/src/admin/admin-city.gateway.ts \
            apps/backend/src/admin/admin-city.gateway.test.ts \
            docs/api/openapi.yaml \
            docs/implementation/phase-2e-merge-blockers-bug-fix.md \
            supabase/migrations/20260728113000_phase_2e_city_activation.sql \
            supabase/tests/0103_phase_2e_city_activation.test.sql
          git commit -m "fix: harden Phase 2E city activation"
          git push origin HEAD:agent/phase-2e-city-activation

          # Bug-fix task record based on codex/BUG_FIX_TEMPLATE.md.
          Path("docs/implementation/phase-2e-merge-blockers-bug-fix.md").write_text("""# Bug-Fix Task\n\n## Observed behavior\n\nPR #169 implemented Phase 2E but CI run #1296 failed in the database lane. The pgTAP suite assumed the created zone occupied array index zero, and activation-report ordering used transaction-stable timestamps, so a later passing fixture could lose to an earlier failed report. Seven review threads also identified lifecycle error conflation, OpenAPI create/update drift, over-broad city list scope, missing branch activation history, unexercised RLS isolation, non-modal dialog handling, and missing create-route 404 contracts.\n\n## Expected behavior\n\nDatabase tests complete all planned assertions deterministically; target validation maps to 400-class input rejection while illegal lifecycle state maps to 409; only global admins and CITY_ADMIN assignments can read the control plane; every bulk-activated branch receives immutable same-transaction history; authenticated clients cannot read private Phase 2E evidence; native dialogs use showModal/close/cancel; and OpenAPI distinguishes create from versioned update requests with documented 404 responses.\n\n## Reproduction\n\n1. Check out PR #169 at `f557f6399ab6a1bbb167ebd381edb2eaf0da6ce0`.\n2. Run `pnpm db:test`.\n3. Observe test 18 returning `NULL` for the positional zone lookup and the suite stopping at `ADMIN_CITY_PREFLIGHT_REQUIRED` with 28 of 39 assertions executed.\n4. Inspect the seven unresolved CodeRabbit threads on PR #169.\n\n## Evidence\n\n- Logs: GitHub Actions CI run #1296, Database and OpenAPI job.\n- Request ID: Not applicable; repository verification failure.\n- Order ID: Not applicable.\n- Screenshot: Playwright evidence passed and is unrelated to the database failure.\n- Environment: GitHub-hosted Ubuntu 24.04 runner, Node.js 20.20.2, pnpm 8.15.0, Supabase CLI 2.109.1.\n- App version: PR #169 head `f557f6399ab6a1bbb167ebd381edb2eaf0da6ce0`.\n\n## Constraints\n\n- Reproduce before changing code.\n- Add a failing regression test first where practical.\n- Fix the root cause, not only the visible symptom.\n- Preserve unrelated behavior.\n- Run relevant full workflow tests.\n- Document data-repair needs separately.\n\n## Data repair\n\nNo production data repair is required because the Phase 2E migration has not been merged. If an equivalent migration had already been applied externally, backfill branch activation history from audit records and branch timestamps before enforcing completeness.\n""")

          # Fail fast if core fixes are absent.
          checks = {
              page: ["showModal()", "addEventListener('cancel'", "requestClose"],
              gateway: ["ADMIN_CITY_TRANSITION_STATE_CONFLICT", "ADMIN_CITY_TRANSITION_TARGET_INVALID"],

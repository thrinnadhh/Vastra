name: Phase 2E merge-blocker repair

on:
  push:
    branches:
      - agent/phase-2e-city-activation

permissions:
  contents: write

concurrency:
  group: phase2e-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/phase-2e-city-activation
          fetch-depth: 0

      - name: Apply reviewed root-cause fixes
        shell: bash
        run: |
          set -o pipefail
          python3 .github/scripts/phase2e_repair_bootstrap.py
          python3 .github/scripts/phase2e_repair.py 2>&1 | tee /tmp/phase2e-apply.log

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/admin-dashboard/src/app/cities/page.tsx
          apps/backend/src/admin/admin-city.gateway.ts
          apps/backend/src/admin/admin-city.gateway.test.ts
          docs/api/openapi.yaml
          docs/implementation/phase-2e-merge-blockers-bug-fix.md

      - name: Run focused backend regression
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @vastra/backend test -- admin-city.gateway.test.ts 2>&1 | tee /tmp/phase2e-backend.log

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.109.1

      - name: Run full database workflow
        shell: bash
        env:
          DB_TEST_DIAGNOSTICS_DIR: /tmp/vastra-db-test-diagnostics
        run: |
          set -o pipefail
          pnpm db:test 2>&1 | tee /tmp/phase2e-db.log

      - name: Validate OpenAPI
        shell: bash
        run: |
          set -o pipefail
          pnpm openapi:check 2>&1 | tee /tmp/phase2e-openapi.log

      - name: Verify generated client
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @vastra/api-client contract:check 2>&1 | tee /tmp/phase2e-contract.log

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/phase2e-repair.yml \
            .github/scripts/phase2e_repair.py \
            .github/scripts/phase2e_repair_bootstrap.py \
            .github/phase2e-repair-failure.md
          git add \
            apps/admin-dashboard/src/app/cities/page.tsx \
            apps/backend/src/admin/admin-city.gateway.ts \
            apps/backend/src/admin/admin-city.gateway.test.ts \
            docs/api/openapi.yaml \
            docs/implementation/phase-2e-merge-blockers-bug-fix.md \
            supabase/migrations/20260728113000_phase_2e_city_activation.sql \
            supabase/tests/0103_phase_2e_city_activation.test.sql
          git commit -m "fix: harden Phase 2E city activation"
          git push origin HEAD:agent/phase-2e-city-activation

      - name: Persist repair diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "# Phase 2E repair failure"
            echo
            echo "Run: $GITHUB_RUN_ID"
            echo "Head: $(git rev-parse HEAD)"
            echo
            for file in /tmp/phase2e-apply.log /tmp/phase2e-backend.log /tmp/phase2e-db.log /tmp/phase2e-openapi.log /tmp/phase2e-contract.log; do
              if test -f "$file"; then
                echo "## $(basename "$file")"
                echo '```text'
                tail -n 250 "$file"
                echo '```'
              fi
            done
            echo "## Working tree"
            echo '```text'
            git status --short
            echo '```'
          } > .github/phase2e-repair-failure.md
          git add .github/phase2e-repair-failure.md
          git commit -m "chore: record Phase 2E repair diagnostics" || true
          git push origin HEAD:agent/phase-2e-city-activation || true

name: FE-S07 publish validated fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/fe-s07-production-closure'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/fe-s07-production-closure
          fetch-depth: 0
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply validated source transformation
        run: |
          python scripts/fe-s07-apply-fixes.py
          pnpm exec prettier --write \
            apps/captain-app/src/captain-operations.screen.test.tsx \
            apps/captain-app/src/delivery/captain-delivery.screen.tsx \
            apps/captain-app/src/delivery/captain-delivery.screen.test.tsx \
            apps/captain-app/src/presence/resilient-captain-presence.port.test.ts

      - name: Revalidate exact result
        run: |
          pnpm exec prettier --check \
            apps/captain-app/src/captain-operations.screen.test.tsx \
            apps/captain-app/src/delivery/captain-delivery.screen.tsx \
            apps/captain-app/src/delivery/captain-delivery.screen.test.tsx \
            apps/captain-app/src/presence/resilient-captain-presence.port.test.ts
          pnpm lint
          pnpm typecheck
          pnpm --filter @vastra/captain-app test
          pnpm --filter @vastra/captain-app build

      - name: Remove temporary tooling
        run: |
          rm -f .github/workflows/fe-s07-final-diagnostics.yml
          rm -f .github/workflows/fe-s07-apply-final-fixes.yml
          rm -f .github/workflows/fe-s07-finalize-fixes.yml
          rm -f .github/workflows/fe-s07-static-diagnostics.yml
          rm -f .github/workflows/fe-s07-publish-validated.yml
          rm -f scripts/fe-s07-apply-fixes.py

      - name: Commit and push production fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/captain-app/src .github/workflows scripts
          git commit -m "fix(fe-s07): resolve PR validation errors"
          git push origin HEAD:agent/fe-s07-production-closure

name: Materialize FE-S06 implementation formatting

on:
  push:
    branches:
      - agent/fe-s06-implementation-integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    name: Format FE-S06 implementation files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format FE-S06 implementation files
        run: |
          pnpm exec prettier --write \
            apps/merchant-app/src/alerts/merchant-alert-diagnostics.screen.tsx \
            apps/merchant-app/src/alerts/merchant-alert-notification.runtime.tsx \
            apps/merchant-app/src/alerts/merchant-alert-notification.types.ts \
            apps/merchant-app/src/alerts/merchant-device-registration.client.ts \
            apps/merchant-app/src/alerts/merchant-device-registration.client.test.ts \
            apps/merchant-app/src/orders/default-merchant-orders.tsx \
            apps/merchant-app/src/readiness/merchant-readiness-gate.tsx \
            apps/merchant-app/src/readiness/merchant-readiness-gate.test.tsx

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/merchant-app/src/alerts/merchant-alert-diagnostics.screen.tsx \
            apps/merchant-app/src/alerts/merchant-alert-notification.runtime.tsx \
            apps/merchant-app/src/alerts/merchant-alert-notification.types.ts \
            apps/merchant-app/src/alerts/merchant-device-registration.client.ts \
            apps/merchant-app/src/alerts/merchant-device-registration.client.test.ts \
            apps/merchant-app/src/orders/default-merchant-orders.tsx \
            apps/merchant-app/src/readiness/merchant-readiness-gate.tsx \
            apps/merchant-app/src/readiness/merchant-readiness-gate.test.tsx
          git commit -m "style(merchant): apply exact Sprint 06 implementation formatting"
          git push origin HEAD:${GITHUB_REF_NAME}

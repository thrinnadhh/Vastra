name: FE-S07 final diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and capture exact sources
        run: |
          mkdir -p diagnostics/formatted/apps/captain-app/src/delivery
          mkdir -p diagnostics/formatted/apps/captain-app/src/presence
          mkdir -p diagnostics/formatted/apps/captain-app/src
          pnpm exec prettier --write \
            apps/captain-app/src/captain-operations.screen.test.tsx \
            apps/captain-app/src/delivery/captain-delivery.screen.tsx \
            apps/captain-app/src/delivery/captain-delivery.screen.test.tsx \
            apps/captain-app/src/presence/resilient-captain-presence.port.test.ts
          cp apps/captain-app/src/captain-operations.screen.test.tsx \
            diagnostics/formatted/apps/captain-app/src/
          cp apps/captain-app/src/delivery/captain-delivery.screen.tsx \
            diagnostics/formatted/apps/captain-app/src/delivery/
          cp apps/captain-app/src/delivery/captain-delivery.screen.test.tsx \
            diagnostics/formatted/apps/captain-app/src/delivery/
          cp apps/captain-app/src/presence/resilient-captain-presence.port.test.ts \
            diagnostics/formatted/apps/captain-app/src/presence/

      - name: Capture lint and typecheck
        run: |
          set +e
          pnpm lint > diagnostics/lint.log 2>&1
          echo $? > diagnostics/lint.exit
          pnpm typecheck > diagnostics/typecheck.log 2>&1
          echo $? > diagnostics/typecheck.exit
          exit 0

      - name: Capture captain tests and build
        run: |
          set +e
          pnpm --filter @vastra/captain-app test > diagnostics/tests.log 2>&1
          echo $? > diagnostics/tests.exit
          pnpm --filter @vastra/captain-app build > diagnostics/build.log 2>&1
          echo $? > diagnostics/build.exit
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fe-s07-final-diagnostics
          path: diagnostics
          if-no-files-found: error
          retention-days: 1

name: Capture FE-S06 lint diagnostics

on:
  push:
    branches:
      - agent/fe-s06-implementation-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Capture merchant lint output
        id: lint
        shell: bash
        run: |
          set +e
          pnpm --filter @vastra/merchant-app lint > fe-s06-lint.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: fe-s06-lint-diagnostics
          path: fe-s06-lint.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve lint result
        run: exit "${{ steps.lint.outputs.exit_code }}"

name: FE-S07 repository test diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture repository unit tests
        run: |
          mkdir -p diagnostics
          set +e
          pnpm test > diagnostics/unit-tests.log 2>&1
          echo $? > diagnostics/unit-tests.exit
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fe-s07-repository-test-diagnostics
          path: diagnostics
          if-no-files-found: error
          retention-days: 1

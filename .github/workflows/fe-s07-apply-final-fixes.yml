name: FE-S07 apply validated final fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.head_ref == 'agent/fe-s07-production-closure'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/fe-s07-production-closure
          fetch-depth: 0
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact static-analysis fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('apps/captain-app/src')

          screen = root / 'delivery/captain-delivery.screen.tsx'
          content = screen.read_text()
          marker = """interface CaptainDeliveryScreenProps {
            readonly client: CaptainDeliveryPort;
            readonly presenceClient: CaptainPresencePort;
            readonly locationProvider: CaptainLocationProvider;
          }
          """
          lifecycle_contract = """
          interface EffectLifecycle {
            active: boolean;
          }

          function createEffectLifecycle(): EffectLifecycle {
            return { active: true };
          }
          """
          if 'interface EffectLifecycle' not in content:
              if marker not in content:
                  raise SystemExit('Captain delivery screen contract marker not found')
              content = content.replace(marker, marker + lifecycle_contract)
          content = content.replace(
              'const mounted = useRef<boolean>(true);',
              'const mounted = useRef(createEffectLifecycle());',
          )
          content = content.replace('mounted.current', 'mounted.current.active')
          content = content.replace(
              'const lifecycle = { stopped: false };',
              'const locationLifecycle = createEffectLifecycle();',
          )
          content = content.replace(
              'lifecycle.stopped',
              '!locationLifecycle.active',
          )
          content = content.replace(
              'if (!!locationLifecycle.active && mounted.current.active)',
              'if (locationLifecycle.active && mounted.current.active)',
          )
          content = content.replace(
              '!locationLifecycle.active = true;',
              'locationLifecycle.active = false;',
          )
          screen.write_text(content)

          delivery_test = root / 'delivery/captain-delivery.screen.test.tsx'
          content = delivery_test.read_text()
          methods = [
              'getTask',
              'acceptOffer',
              'rejectOffer',
              'arrivePickup',
              'verifyPickup',
              'departPickup',
              'arriveDrop',
              'complete',
          ]
          for method in methods:
              pattern = re.compile(
                  rf"(    {method}: )jest\.fn\((.*?)\) as jest\.MockedFunction<\n?"
                  rf"\s*CaptainDeliveryPort\['{method}'\]\n?\s*>,",
                  re.S,
              )
              match = pattern.search(content)
              if match is None:
                  raise SystemExit(f'Captain delivery mock not found: {method}')
              implementation = match.group(2)
              replacement = (
                  f"    {method}: jest.fn<\n"
                  f"      ReturnType<CaptainDeliveryPort['{method}']>,\n"
                  f"      Parameters<CaptainDeliveryPort['{method}']>\n"
                  f"    >({implementation}),"
              )
              content = content[: match.start()] + replacement + content[match.end() :]

          pattern = re.compile(
              r"(    watchLocations: )jest\.fn\((.*?)\) as jest\.MockedFunction<\n?"
              r"\s*CaptainLocationProvider\['watchLocations'\]\n?\s*>,",
              re.S,
          )
          match = pattern.search(content)
          if match is None:
              raise SystemExit('Captain location watcher mock not found')
          implementation = match.group(2)
          replacement = (
              "    watchLocations: jest.fn<\n"
              "      ReturnType<CaptainLocationProvider['watchLocations']>,\n"
              "      Parameters<CaptainLocationProvider['watchLocations']>\n"
              f"    >({implementation}),"
          )
          content = content[: match.start()] + replacement + content[match.end() :]
          delivery_test.write_text(content)

          presence_test = root / 'presence/resilient-captain-presence.port.test.ts'
          content = presence_test.read_text()
          for method in ['setAvailability', 'updateLocation']:
              pattern = re.compile(
                  rf"(    {method}: )jest\.fn\((.*?)\) as jest\.MockedFunction<\n?"
                  rf"\s*CaptainPresencePort\['{method}'\]\n?\s*>,",
                  re.S,
              )
              match = pattern.search(content)
              if match is None:
                  raise SystemExit(f'Captain presence mock not found: {method}')
              implementation = match.group(2)
              replacement = (
                  f"    {method}: jest.fn<\n"
                  f"      ReturnType<CaptainPresencePort['{method}']>,\n"
                  f"      Parameters<CaptainPresencePort['{method}']>\n"
                  f"    >({implementation}),"
              )
              content = content[: match.start()] + replacement + content[match.end() :]
          presence_test.write_text(content)
          PY

      - name: Apply repository formatting
        run: |
          pnpm exec prettier --write \
            apps/captain-app/src/captain-operations.screen.test.tsx \
            apps/captain-app/src/delivery/captain-delivery.screen.tsx \
            apps/captain-app/src/delivery/captain-delivery.screen.test.tsx \
            apps/captain-app/src/presence/resilient-captain-presence.port.test.ts

      - name: Validate static quality
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck

      - name: Validate captain application
        run: |
          pnpm --filter @vastra/captain-app test
          pnpm --filter @vastra/captain-app build

      - name: Package validated sources
        run: |
          mkdir -p validated/apps/captain-app/src/delivery
          mkdir -p validated/apps/captain-app/src/presence
          mkdir -p validated/apps/captain-app/src
          cp apps/captain-app/src/captain-operations.screen.test.tsx \
            validated/apps/captain-app/src/
          cp apps/captain-app/src/delivery/captain-delivery.screen.tsx \
            validated/apps/captain-app/src/delivery/
          cp apps/captain-app/src/delivery/captain-delivery.screen.test.tsx \
            validated/apps/captain-app/src/delivery/
          cp apps/captain-app/src/presence/resilient-captain-presence.port.test.ts \
            validated/apps/captain-app/src/presence/

      - name: Upload validated sources
        uses: actions/upload-artifact@v6
        with:
          name: fe-s07-validated-final-sources
          path: validated
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/fe-s07-final-diagnostics.yml
          rm -f .github/workflows/fe-s07-apply-final-fixes.yml

      - name: Commit and push validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/captain-app/src .github/workflows
          git commit -m "fix(fe-s07): resolve PR validation errors"
          git push origin HEAD:agent/fe-s07-production-closure

name: Phase 2E modal lint repair
# Registered trigger for the Phase 2E modal correction.

on:
  push:
    branches:
      - agent/phase-2e-city-activation
    paths:
      - .github/workflows/phase2e-modal-lint-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/phase-2e-city-activation
          fetch-depth: 0

      - name: Replace render-time ref mutation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/admin-dashboard/src/app/cities/page.tsx')
          text = path.read_text()
          old = """  const dialog = useRef<HTMLDialogElement>(null);
  const busyRef = useRef(busy);
  const onCloseRef = useRef(onClose);
  busyRef.current = busy;
  onCloseRef.current = onClose;

  useEffect(() => {
    const element = dialog.current;
    if (element === null) return;
    if (!element.open) element.showModal();

    const cancel = (event: Event) => {
      event.preventDefault();
      if (busyRef.current) return;
      element.close();
      onCloseRef.current();
    };

    element.addEventListener('cancel', cancel);
    return () => {
      element.removeEventListener('cancel', cancel);
      if (element.open) element.close();
    };
  }, []);

  const requestClose = () => {
    if (busyRef.current) return;
    if (dialog.current?.open) dialog.current.close();
    onCloseRef.current();
  };
"""
          new = """  const dialog = useRef<HTMLDialogElement>(null);

  useEffect(() => {
    const element = dialog.current;
    if (element === null) return;
    if (!element.open) element.showModal();

    return () => {
      if (element.open) element.close();
    };
  }, []);

  useEffect(() => {
    const element = dialog.current;
    if (element === null) return;

    const cancel = (event: Event) => {
      event.preventDefault();
      if (busy) return;
      element.close();
      onClose();
    };

    element.addEventListener('cancel', cancel);
    return () => element.removeEventListener('cancel', cancel);
  }, [busy, onClose]);

  const requestClose = () => {
    if (busy) return;
    if (dialog.current?.open) dialog.current.close();
    onClose();
  };
"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one modal ref block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format modal source
        run: pnpm exec prettier --write apps/admin-dashboard/src/app/cities/page.tsx

      - name: Verify lint
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee /tmp/phase2e-modal-lint.log

      - name: Commit verified correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase2e-modal-lint-repair.yml
          git add apps/admin-dashboard/src/app/cities/page.tsx
          git commit -m "fix(admin): avoid render-time dialog ref mutation"
          git push origin HEAD:agent/phase-2e-city-activation

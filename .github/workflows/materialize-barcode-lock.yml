name: Materialize barcode lock

on:
  pull_request:
    paths:
      - .barcode-materialize/**
      - apps/backend/src/catalogue/merchant-inventory-barcode.gateway.ts
      - apps/backend/src/catalogue/merchant-inventory-barcode.gateway.test.ts
      - apps/merchant-app/**
      - docs/implementation/barcode-end-to-end.md
      - supabase/migrations/20260805093333_merchant_order_packing.sql
      - pnpm-lock.yaml
      - .github/workflows/materialize-barcode-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Materialize large source files
        run: |
          mkdir -p apps/merchant-app/src/inventory apps/merchant-app/src/orders
          cat .barcode-materialize/inventory.part* > apps/merchant-app/src/inventory/merchant-inventory.screen.tsx
          cat .barcode-materialize/packing.part* > apps/merchant-app/src/orders/merchant-order-packing.screen.tsx
          rm -rf .barcode-materialize

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Materialize dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Format barcode implementation
        run: |
          pnpm exec prettier --write \
            apps/backend/src/catalogue/merchant-inventory-barcode.gateway.ts \
            apps/backend/src/catalogue/merchant-inventory-barcode.gateway.test.ts \
            apps/merchant-app/App.tsx \
            apps/merchant-app/App.test.tsx \
            apps/merchant-app/app.json \
            apps/merchant-app/package.json \
            apps/merchant-app/src/barcode \
            apps/merchant-app/src/inventory \
            apps/merchant-app/src/orders/merchant-order-packing.screen.tsx \
            apps/merchant-app/src/orders/merchant-order-packing.scanner.test.tsx \
            docs/implementation/barcode-end-to-end.md \
            supabase/migrations/20260805093333_merchant_order_packing.sql \
            .github/workflows/materialize-barcode-lock.yml

      - name: Commit generated changes when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: materialize barcode dependency lock"
          git push

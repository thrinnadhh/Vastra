name: Phase 2C database diagnostics

on:
  push:
    branches:
      - agent/phase-2c-serviceability-catalogue
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: phase2c-db-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-diagnostics:
    name: Capture complete database diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.109.1

      - name: Capture database test output
        id: database
        shell: bash
        run: |
          set +e
          pnpm db:test > /tmp/phase2c-database.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 250 /tmp/phase2c-database.log
          exit 0

      - name: Upload complete database diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase2c-database-diagnostics-${{ github.run_attempt }}
          path: /tmp/phase2c-database.log
          if-no-files-found: error
          retention-days: 2

      - name: Post failure excerpt to PR
        if: steps.database.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '<!-- phase2c-database-diagnostic -->'
            echo '### Phase 2C database diagnostic'
            echo
            echo '```text'
            tail -n 140 /tmp/phase2c-database.log
            echo '```'
          } > /tmp/phase2c-comment.md
          gh pr comment 160 --body-file /tmp/phase2c-comment.md

      - name: Preserve database result
        env:
          DATABASE_STATUS: ${{ steps.database.outputs.status }}
        run: test "$DATABASE_STATUS" = "0"

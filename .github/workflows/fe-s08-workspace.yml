name: FE-S08 materialize exact frontend workspace

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-workspace:
    if: github.head_ref == 'automation/fe-s08-workspace'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI client
        run: pnpm --filter @vastra/api-client generate

      - name: Package exact workspace
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.turbo \
            --exclude=.next \
            --exclude=dist \
            -czf /tmp/vastra-fe-s08-workspace.tgz .

      - name: Upload exact workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vastra-fe-s08-workspace
          path: /tmp/vastra-fe-s08-workspace.tgz
          if-no-files-found: error
          retention-days: 1

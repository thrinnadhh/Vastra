name: Phase 2E modal lint repair

on:
  push:
    branches:
      - agent/phase-2e-city-activation

permissions:
  contents: write

concurrency:
  group: phase2e-modal-lint-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/phase-2e-city-activation
          fetch-depth: 0

      - name: Patch modal effects and remove lint suppression
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/phase2e-modal-patch.log
          from pathlib import Path

          page = Path('apps/admin-dashboard/src/app/cities/page.tsx')
          text = page.read_text()
          old = """  const dialog = useRef<HTMLDialogElement>(null);
  const busyRef = useRef(busy);
  const onCloseRef = useRef(onClose);
  busyRef.current = busy;
  onCloseRef.current = onClose;

  useEffect(() => {
    const element = dialog.current;
    if (element === null) return;
    if (!element.open) element.showModal();

    const cancel = (event: Event) => {
      event.preventDefault();
      if (busyRef.current) return;
      element.close();
      onCloseRef.current();
    };

    element.addEventListener('cancel', cancel);
    return () => {
      element.removeEventListener('cancel', cancel);
      if (element.open) element.close();
    };
  }, []);

  const requestClose = () => {
    if (busyRef.current) return;
    if (dialog.current?.open) dialog.current.close();
    onCloseRef.current();
  };
"""
          new = """  const dialog = useRef<HTMLDialogElement>(null);

  useEffect(() => {
    const element = dialog.current;
    if (element === null) return;
    if (!element.open) element.showModal();

    return () => {
      if (element.open) element.close();
    };
  }, []);

  useEffect(() => {
    const element = dialog.current;
    if (element === null) return;

    const cancel = (event: Event) => {
      event.preventDefault();
      if (busy) return;
      element.close();
      onClose();
    };

    element.addEventListener('cancel', cancel);
    return () => element.removeEventListener('cancel', cancel);
  }, [busy, onClose]);

  const requestClose = () => {
    if (busy) return;
    if (dialog.current?.open) dialog.current.close();
    onClose();
  };
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one modal block, found {text.count(old)}')
          page.write_text(text.replace(old, new, 1))

          config = Path('eslint.config.mjs')
          config_text = config.read_text()
          override = """  {
    files: ['apps/admin-dashboard/src/app/cities/page.tsx'],
    rules: {
      // The native dialog's cancel listener stores latest non-rendering callbacks in refs.
      'react-hooks/refs': 'off',
    },
  },
"""
          if config_text.count(override) != 1:
              raise SystemExit(f'expected one modal lint override, found {config_text.count(override)}')
          config.write_text(config_text.replace(override, '', 1))
          PY

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: pnpm exec prettier --write apps/admin-dashboard/src/app/cities/page.tsx eslint.config.mjs

      - name: Run lint
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee /tmp/phase2e-modal-lint.log

      - name: Run typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee /tmp/phase2e-modal-typecheck.log

      - name: Commit verified lint repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/phase2e-lint-fix.yml .github/phase2e-modal-lint-failure.md
          git add apps/admin-dashboard/src/app/cities/page.tsx eslint.config.mjs
          git commit -m "fix: satisfy modal lifecycle lint"
          git push origin HEAD:agent/phase-2e-city-activation

      - name: Persist diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "# Phase 2E modal lint repair failure"
            echo
            echo "Run: $GITHUB_RUN_ID"
            echo "Head: $(git rev-parse HEAD)"
            for file in /tmp/phase2e-modal-patch.log /tmp/phase2e-modal-lint.log /tmp/phase2e-modal-typecheck.log; do
              if test -f "$file"; then
                echo
                echo "## $(basename "$file")"
                echo '```text'
                tail -n 250 "$file"
                echo '```'
              fi
            done
            echo
            echo "## Working tree"
            echo '```text'
            git status --short
            echo '```'
          } > .github/phase2e-modal-lint-failure.md
          git add .github/phase2e-modal-lint-failure.md
          git commit -m "chore: record modal lint repair diagnostics" || true
          git push origin HEAD:agent/phase-2e-city-activation || true

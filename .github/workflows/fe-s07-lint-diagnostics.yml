name: FE-S07 lint diagnostics

on:
  pull_request:
    paths:
      - 'apps/captain-app/src/**'
      - '.github/workflows/fe-s07-lint-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture focused ESLint report
        id: eslint
        continue-on-error: true
        run: |
          pnpm exec eslint \
            apps/captain-app/src/auth/captain-api-session.tsx \
            apps/captain-app/src/captain-operations.screen.tsx \
            apps/captain-app/src/delivery/hardened-captain-delivery.screen.tsx \
            apps/captain-app/src/delivery/resilient-captain-delivery.port.ts \
            apps/captain-app/src/delivery/resilient-captain-delivery.port.test.ts \
            --format json > fe-s07-eslint.json

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: fe-s07-eslint
          path: fe-s07-eslint.json
          if-no-files-found: error
          retention-days: 2

      - name: Require lint success
        if: steps.eslint.outcome != 'success'
        run: exit 1

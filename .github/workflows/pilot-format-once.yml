name: Format pilot execution tooling once

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'docs/pilot/**'
      - 'package.json'
      - '.github/workflows/pilot-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact repository formatting
        run: >-
          pnpm exec prettier --write
          package.json
          scripts/pilot-execution-report-lib.mjs
          scripts/validate-pilot-execution-report.mjs
          scripts/run-staging-cod-observer.mjs
          scripts/run-pilot-query-plans.mjs
          scripts/run-pilot-invariant-audit.mjs
          scripts/run-pilot-http-load.mjs
          scripts/run-pilot-tooling-tests.mjs
          docs/pilot/README.md
          docs/pilot/execution-tooling.md
          docs/pilot/load-scenario-plan.template.json
          docs/pilot/evidence/templates/staging-cod-report.template.json
          docs/pilot/evidence/templates/device-fcm-report.template.json
          docs/pilot/evidence/templates/load-query-report.template.json
          docs/pilot/evidence/templates/admin-recovery-report.template.json

      - name: Commit exact formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            scripts/pilot-execution-report-lib.mjs \
            scripts/validate-pilot-execution-report.mjs \
            scripts/run-staging-cod-observer.mjs \
            scripts/run-pilot-query-plans.mjs \
            scripts/run-pilot-invariant-audit.mjs \
            scripts/run-pilot-http-load.mjs \
            scripts/run-pilot-tooling-tests.mjs \
            docs/pilot/README.md \
            docs/pilot/execution-tooling.md \
            docs/pilot/load-scenario-plan.template.json \
            docs/pilot/evidence/templates/staging-cod-report.template.json \
            docs/pilot/evidence/templates/device-fcm-report.template.json \
            docs/pilot/evidence/templates/load-query-report.template.json \
            docs/pilot/evidence/templates/admin-recovery-report.template.json
          git commit -m "style(pilot): apply exact execution-tooling format"
          git push origin HEAD:${{ github.head_ref }}

name: FE-S07 focused diagnostics

on:
  push:
    branches:
      - agent/fe-s07-production-closure
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture exact Prettier output
        run: |
          mkdir -p diagnostics/formatted
          files=(
            apps/captain-app/src/captain-operations.screen.test.tsx
            apps/captain-app/src/captain-operations.screen.tsx
            apps/captain-app/src/delivery/captain-active-delivery.card.tsx
            apps/captain-app/src/delivery/captain-delivery.offer-card.tsx
            apps/captain-app/src/delivery/captain-delivery.screen.test.tsx
            apps/captain-app/src/delivery/captain-delivery.screen.tsx
            apps/captain-app/src/delivery/captain-delivery.view.ts
            apps/captain-app/src/delivery/hardened-captain-delivery.screen.tsx
            apps/captain-app/src/presence/hardened-captain-presence.screen.tsx
            apps/captain-app/src/presence/resilient-captain-presence.port.test.ts
            apps/captain-app/src/presence/resilient-captain-presence.port.ts
            docs/implementation/fe-s07-production-closure.md
          )
          pnpm exec prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            mkdir -p "diagnostics/formatted/$(dirname "$file")"
            cp "$file" "diagnostics/formatted/$file"
          done
          git diff -- "${files[@]}" > diagnostics/prettier.patch

      - name: Capture captain typecheck
        continue-on-error: true
        run: |
          set +e
          pnpm --filter @vastra/captain-app typecheck > diagnostics/typecheck.log 2>&1
          echo $? > diagnostics/typecheck.exit

      - name: Capture captain tests
        continue-on-error: true
        run: |
          set +e
          pnpm --filter @vastra/captain-app test > diagnostics/tests.log 2>&1
          echo $? > diagnostics/tests.exit

      - name: Capture captain build
        continue-on-error: true
        run: |
          set +e
          pnpm --filter @vastra/captain-app build > diagnostics/build.log 2>&1
          echo $? > diagnostics/build.exit

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fe-s07-focused-diagnostics
          path: diagnostics
          if-no-files-found: error
          retention-days: 1

name: Format final FE-S07 once

on:
  pull_request:
    paths:
      - 'apps/captain-app/src/delivery/resilient-captain-delivery.port.ts'
      - 'apps/captain-app/src/delivery/resilient-captain-delivery.port.test.ts'
      - '.github/workflows/fe-s07-format-final-once.yml'

permissions:
  contents: write

concurrency:
  group: fe-s07-format-final-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull-request head without credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository formatting
        run: >-
          pnpm exec prettier --write
          apps/captain-app/src/delivery/resilient-captain-delivery.port.ts
          apps/captain-app/src/delivery/resilient-captain-delivery.port.test.ts

      - name: Commit and push exact formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/captain-app/src/delivery/resilient-captain-delivery.port.ts \
            apps/captain-app/src/delivery/resilient-captain-delivery.port.test.ts
          git commit -m "style(captain): format reject-race hardening"
          git fetch origin "${GITHUB_HEAD_REF}"
          git rebase "origin/${GITHUB_HEAD_REF}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_HEAD_REF}"

name: FE-S08 finalize admin control plane

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fe-s08-frontend-finalize
  cancel-in-progress: false

jobs:
  apply-validate-publish:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/fe-s08-admin-control-plane'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out FE-S08 branch
        uses: actions/checkout@v7
        with:
          ref: agent/fe-s08-admin-control-plane
          fetch-depth: 0

      - name: Decode staged frontend implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import lzma

          chunks = sorted(Path('.github/fe-s08-frontend').glob('chunk-*'))
          if len(chunks) != 3:
              raise SystemExit(f'expected 3 chunks, found {len(chunks)}')
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
          compressed = base64.b64decode(encoded, validate=True)
          patch = lzma.decompress(compressed)
          Path('/tmp/fe-s08-frontend.patch').write_bytes(patch)
          print(f'decoded {len(patch)} patch bytes')
          PY
          echo 'ff1608bd88504156d110d983dabdd6787cc45d56d963e74f6054d34e509f608d  /tmp/fe-s08-frontend.patch' | sha256sum --check
          git apply --check /tmp/fe-s08-frontend.patch

      - name: Apply production implementation and remove transport files
        run: |
          git apply /tmp/fe-s08-frontend.patch
          rm -rf .github/fe-s08-frontend
          rm -f .github/workflows/fe-s08-frontend-finalize.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Generate OpenAPI client
        run: pnpm --filter @vastra/api-client generate

      - name: Format implementation
        run: pnpm format > /tmp/fe-s08-format.log 2>&1

      - name: Apply strict lint corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import lzma

          repairs = (
              (
                  Path('.github/fe-s08-lint-repair.xz.b64'),
                  Path('/tmp/fe-s08-lint-repair.patch'),
              ),
              (
                  Path('.github/fe-s08-lint-repair-2.xz.b64'),
                  Path('/tmp/fe-s08-lint-repair-2.patch'),
              ),
          )
          for source, target in repairs:
              encoded = source.read_text(encoding='utf-8').strip()
              compressed = base64.b64decode(encoded, validate=True)
              target.write_bytes(lzma.decompress(compressed))
          PY
          echo '177ffcffc5bf2601a47a64b48a9a69bbdf419cbd42f71e55ef0f6813fe0c4266  /tmp/fe-s08-lint-repair.patch' | sha256sum --check
          echo 'dc904f30cd10f30379c081833a729050189301d1518d6d62cc8ad9e887d029c0  /tmp/fe-s08-lint-repair-2.patch' | sha256sum --check
          git apply --check /tmp/fe-s08-lint-repair.patch
          git apply /tmp/fe-s08-lint-repair.patch
          git apply --check /tmp/fe-s08-lint-repair-2.patch
          git apply /tmp/fe-s08-lint-repair-2.patch
          rm -f .github/fe-s08-lint-repair.xz.b64 .github/fe-s08-lint-repair-2.xz.b64
          pnpm format > /tmp/fe-s08-reformat.log 2>&1

      - name: Check formatting
        run: |
          if ! pnpm format:check > /tmp/fe-s08-format-check.log 2>&1; then
            tail -n 200 /tmp/fe-s08-format-check.log
            exit 1
          fi

      - name: Validate environment and client-secret boundaries
        run: |
          pnpm env:check > /tmp/fe-s08-env.log 2>&1
          pnpm security:client-secrets > /tmp/fe-s08-secrets.log 2>&1

      - name: Run lint
        run: |
          if ! pnpm lint > /tmp/fe-s08-lint.log 2>&1; then
            tail -n 240 /tmp/fe-s08-lint.log
            exit 1
          fi

      - name: Run strict TypeScript checks
        run: |
          if ! pnpm typecheck > /tmp/fe-s08-typecheck.log 2>&1; then
            tail -n 260 /tmp/fe-s08-typecheck.log
            exit 1
          fi

      - name: Run admin unit tests
        run: |
          if ! pnpm --filter @vastra/admin-dashboard test > /tmp/fe-s08-unit.log 2>&1; then
            tail -n 260 /tmp/fe-s08-unit.log
            exit 1
          fi

      - name: Validate OpenAPI
        run: |
          if ! pnpm openapi:check > /tmp/fe-s08-openapi.log 2>&1; then
            tail -n 240 /tmp/fe-s08-openapi.log
            exit 1
          fi

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run admin keyboard, responsive and recovery E2E
        run: |
          if ! pnpm exec playwright test --project=admin > /tmp/fe-s08-e2e.log 2>&1; then
            tail -n 300 /tmp/fe-s08-e2e.log
            exit 1
          fi

      - name: Build admin application
        env:
          NEXT_PUBLIC_ADMIN_E2E_FIXTURE: '1'
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080/v1
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-public-publishable-key
        run: |
          if ! pnpm --filter @vastra/admin-dashboard build > /tmp/fe-s08-build.log 2>&1; then
            tail -n 240 /tmp/fe-s08-build.log
            exit 1
          fi

      - name: Upload FE-S08 diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fe-s08-frontend-diagnostics
          path: |
            /tmp/fe-s08-*.log
            apps/admin-dashboard/src
            e2e/admin-shell.spec.ts
            docs/api/openapi.yaml
            playwright-report
            test-results/playwright
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit validated production tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(fe-s08): implement admin control plane"
          git push origin HEAD:agent/fe-s08-admin-control-plane

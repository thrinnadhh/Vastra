name: Prepare pilot execution tooling once

on:
  push:
    branches:
      - agent/pilot-execution-tooling

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository formatting
        run: >-
          pnpm exec prettier --write
          package.json
          scripts/pilot-execution-report-lib.mjs
          scripts/validate-pilot-execution-report.mjs
          scripts/run-staging-cod-observer.mjs
          scripts/run-pilot-query-plans.mjs
          scripts/run-pilot-invariant-audit.mjs
          scripts/run-pilot-http-load.mjs
          scripts/run-pilot-tooling-tests.mjs
          docs/pilot/README.md
          docs/pilot/execution-tooling.md
          docs/pilot/load-scenario-plan.template.json
          docs/pilot/evidence/templates/staging-cod-report.template.json
          docs/pilot/evidence/templates/device-fcm-report.template.json
          docs/pilot/evidence/templates/load-query-report.template.json
          docs/pilot/evidence/templates/admin-recovery-report.template.json

      - name: Apply repository lint fixes
        run: >-
          pnpm exec eslint --fix
          scripts/pilot-execution-report-lib.mjs
          scripts/validate-pilot-execution-report.mjs
          scripts/run-staging-cod-observer.mjs
          scripts/run-pilot-query-plans.mjs
          scripts/run-pilot-invariant-audit.mjs
          scripts/run-pilot-http-load.mjs
          scripts/run-pilot-tooling-tests.mjs

      - name: Check Node syntax
        run: |
          node --check scripts/pilot-execution-report-lib.mjs
          node --check scripts/validate-pilot-execution-report.mjs
          node --check scripts/run-staging-cod-observer.mjs
          node --check scripts/run-pilot-query-plans.mjs
          node --check scripts/run-pilot-invariant-audit.mjs
          node --check scripts/run-pilot-http-load.mjs

      - name: Run pilot tooling tests
        run: pnpm test:pilot-tooling

      - name: Commit exact toolchain output
        run: |
          if git diff --quiet; then
            echo "No formatter or lint changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            scripts/pilot-execution-report-lib.mjs \
            scripts/validate-pilot-execution-report.mjs \
            scripts/run-staging-cod-observer.mjs \
            scripts/run-pilot-query-plans.mjs \
            scripts/run-pilot-invariant-audit.mjs \
            scripts/run-pilot-http-load.mjs \
            scripts/run-pilot-tooling-tests.mjs \
            docs/pilot/README.md \
            docs/pilot/execution-tooling.md \
            docs/pilot/load-scenario-plan.template.json \
            docs/pilot/evidence/templates/staging-cod-report.template.json \
            docs/pilot/evidence/templates/device-fcm-report.template.json \
            docs/pilot/evidence/templates/load-query-report.template.json \
            docs/pilot/evidence/templates/admin-recovery-report.template.json
          git commit -m "style(pilot): apply exact execution-tooling format"
          git push

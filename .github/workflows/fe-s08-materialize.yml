name: FE-S08 materialize backend workspace

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  materialize:
    if: github.head_ref == 'agent/fe-s08-backend-recovery'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Package repository source
        run: git archive --format=tar.gz --output=/tmp/fe-s08-workspace.tar.gz HEAD

      - name: Upload workspace
        uses: actions/upload-artifact@v6
        with:
          name: fe-s08-workspace-recovery
          path: /tmp/fe-s08-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1

name: Fix pilot observer lint once

on:
  pull_request:
    paths:
      - 'scripts/run-staging-cod-observer.mjs'
      - '.github/workflows/pilot-lint-fix-once.yml'

permissions:
  contents: write

concurrency:
  group: pilot-lint-fix-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull-request head without credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Replace forced success exit with normal completion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run-staging-cod-observer.mjs')
          source = path.read_text()
          source = source.replace('      process.exit(0);\n', '      break;\n')
          old = """
            report.status = 'BLOCKED';
            report.completedAt = now();
            report.notes = 'Observer timeout expired before every authoritative checkpoint was observed.';
            for (const step of report.steps) {
              if (step.status !== 'PASS') {
                step.status = 'BLOCKED';
                step.notes = 'Not observed before the configured timeout.';
              }
            }
            writeReport(report, outputPath);
            console.error(`BLOCKED: staging COD observer timed out. Report: ${outputPath}`);
            process.exitCode = 1;
          """
          new = """
            if (report.status !== 'PASS') {
              report.status = 'BLOCKED';
              report.completedAt = now();
              report.notes = 'Observer timeout expired before every authoritative checkpoint was observed.';
              for (const step of report.steps) {
                if (step.status !== 'PASS') {
                  step.status = 'BLOCKED';
                  step.notes = 'Not observed before the configured timeout.';
                }
              }
              writeReport(report, outputPath);
              console.error(`BLOCKED: staging COD observer timed out. Report: ${outputPath}`);
              process.exitCode = 1;
            }
          """
          if old not in source:
              raise SystemExit('Expected observer timeout block was not found.')
          path.write_text(source.replace(old, new))
          PY

      - name: Format and lint the observer
        run: |
          pnpm exec prettier --write scripts/run-staging-cod-observer.mjs
          pnpm exec eslint scripts/run-staging-cod-observer.mjs
          node --check scripts/run-staging-cod-observer.mjs

      - name: Commit and push the lint fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No lint changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run-staging-cod-observer.mjs
          git commit -m "fix(pilot): finish staging observation without forced exit"
          git fetch origin "${GITHUB_HEAD_REF}"
          git rebase "origin/${GITHUB_HEAD_REF}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_HEAD_REF}"

name: FE-S07 transformed static diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnostics:
    if: github.head_ref == 'agent/fe-s07-production-closure'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/fe-s07-production-closure

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply and format fixes
        run: |
          python scripts/fe-s07-apply-fixes.py
          pnpm exec prettier --write \
            apps/captain-app/src/captain-operations.screen.test.tsx \
            apps/captain-app/src/delivery/captain-delivery.screen.tsx \
            apps/captain-app/src/delivery/captain-delivery.screen.test.tsx \
            apps/captain-app/src/presence/resilient-captain-presence.port.test.ts

      - name: Capture checks
        run: |
          mkdir -p diagnostics/sources/apps/captain-app/src/delivery
          mkdir -p diagnostics/sources/apps/captain-app/src/presence
          mkdir -p diagnostics/sources/apps/captain-app/src
          set +e
          pnpm lint > diagnostics/lint.log 2>&1
          echo $? > diagnostics/lint.exit
          pnpm typecheck > diagnostics/typecheck.log 2>&1
          echo $? > diagnostics/typecheck.exit
          pnpm --filter @vastra/captain-app test > diagnostics/tests.log 2>&1
          echo $? > diagnostics/tests.exit
          pnpm --filter @vastra/captain-app build > diagnostics/build.log 2>&1
          echo $? > diagnostics/build.exit
          cp apps/captain-app/src/captain-operations.screen.test.tsx \
            diagnostics/sources/apps/captain-app/src/
          cp apps/captain-app/src/delivery/captain-delivery.screen.tsx \
            diagnostics/sources/apps/captain-app/src/delivery/
          cp apps/captain-app/src/delivery/captain-delivery.screen.test.tsx \
            diagnostics/sources/apps/captain-app/src/delivery/
          cp apps/captain-app/src/presence/resilient-captain-presence.port.test.ts \
            diagnostics/sources/apps/captain-app/src/presence/
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fe-s07-transformed-static-diagnostics
          path: diagnostics
          if-no-files-found: error
          retention-days: 1

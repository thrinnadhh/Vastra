name: Lint FE-S07 once

on:
  push:
    branches:
      - agent/fe-s07-captain-cod-hardening

permissions:
  contents: write

jobs:
  lint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository lint fixes
        run: >-
          pnpm exec eslint --fix
          apps/captain-app/src/auth/captain-api-session.tsx
          apps/captain-app/src/captain-operations.screen.tsx
          apps/captain-app/src/delivery/hardened-captain-delivery.screen.tsx
          apps/captain-app/src/delivery/resilient-captain-delivery.port.ts
          apps/captain-app/src/delivery/resilient-captain-delivery.port.test.ts

      - name: Commit exact lint fixes
        run: |
          if git diff --quiet; then
            echo "No auto-fixable lint changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/captain-app/src/auth/captain-api-session.tsx \
            apps/captain-app/src/captain-operations.screen.tsx \
            apps/captain-app/src/delivery/hardened-captain-delivery.screen.tsx \
            apps/captain-app/src/delivery/resilient-captain-delivery.port.ts \
            apps/captain-app/src/delivery/resilient-captain-delivery.port.test.ts
          git commit -m "style(captain): apply exact FE-S07 lint fixes"
          git push

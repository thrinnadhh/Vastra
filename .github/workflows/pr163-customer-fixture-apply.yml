name: PR 163 Customer Fixture Diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr163-customer-fixture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose customer fixture fixes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/phase-2d-b-checkout-integration
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Upgrade customer quote fixtures
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function replaceOnce(path, oldValue, newValue) {
            const source = fs.readFileSync(path, 'utf8');
            const count = source.split(oldValue).length - 1;
            if (count !== 1) throw new Error(`${path}: expected one match, found ${count}`);
            fs.writeFileSync(path, source.replace(oldValue, newValue));
          }
          const contract = `  branch: {
            id: 'a0000000-0000-4000-8000-000000000001',
            code: 'TIR-01',
            name: 'Tirupati Branch',
            type: 'PHYSICAL_STORE',
            addressId: 'b0000000-0000-4000-8000-000000000001',
            returnAddressId: 'c0000000-0000-4000-8000-000000000001',
            pincode: '517501',
            latitude: 13.6288,
            longitude: 79.4192,
          },
          geography: {
            cityId: 'd0000000-0000-4000-8000-000000000001',
            cityCode: 'TIRUPATI',
            cityName: 'Tirupati',
            serviceZoneId: 'e0000000-0000-4000-8000-000000000001',
            serviceZoneCode: 'TIR-CENTRAL',
            serviceZoneName: 'Tirupati Central',
            customerPincode: '517501',
            fulfilmentMode: 'LOCAL_DELIVERY',
            distanceMeters: 500,
            deliveryRadiusMeters: 5000,
          },
          `;
          const screen = 'apps/customer-app/src/checkout/customer-checkout-quote.screen.test.tsx';
          replaceOnce(screen, '  id: QUOTE_ID,\n  cartId: CART_ID,', '  id: QUOTE_ID,\n  contractVersion: 2,\n  cartId: CART_ID,');
          replaceOnce(screen, `  shop: {
            id: '50000000-0000-4000-8000-000000000001',
            name: 'Synthetic Quote Shop',
            slug: 'synthetic-quote-shop',
            minimumOrderPaise: 0,
            averagePreparationMinutes: 20,
            distanceMeters: 500,
            serviceRadiusMeters: 5000,
          },
          `, `  shop: {
            id: '50000000-0000-4000-8000-000000000001',
            name: 'Synthetic Quote Shop',
            slug: 'synthetic-quote-shop',
            minimumOrderPaise: 0,
          },
          ${contract}`);
          replaceOnce(screen, '      inventoryVersion: 1,', '      branchInventoryVersion: 1,');
          replaceOnce(screen, '  estimatedPreparationMinutes: 20,', `  fulfilmentMode: 'LOCAL_DELIVERY',
          codEligible: true,
          codLimitPaise: 100_000,
          estimatedPreparationMinutes: 20,`);
          replaceOnce(screen, "  estimatedDeliveryAt: '2026-07-16T10:35:00.000Z',", "  estimatedDeliveryAt: '2026-07-16T10:35:00.000Z',\n  cityConfigurationVersion: 1,");
          const journey = 'apps/customer-app/src/orders/customer-cod-order-journey.test.tsx';
          replaceOnce(journey, '  id: QUOTE_ID,\n  cartId: CART_ID,', '  id: QUOTE_ID,\n  contractVersion: 2,\n  cartId: CART_ID,');
          replaceOnce(journey, `  shop: {
            id: SHOP_ID,
            name: 'Synthetic Journey Shop',
            slug: 'synthetic-journey-shop',
            minimumOrderPaise: 0,
            averagePreparationMinutes: 20,
            distanceMeters: 500,
            serviceRadiusMeters: 5000,
          },
          `, `  shop: {
            id: SHOP_ID,
            name: 'Synthetic Journey Shop',
            slug: 'synthetic-journey-shop',
            minimumOrderPaise: 0,
          },
          ${contract}`);
          replaceOnce(journey, '      inventoryVersion: 7,', '      branchInventoryVersion: 7,');
          replaceOnce(journey, '  estimatedPreparationMinutes: 20,', `  fulfilmentMode: 'LOCAL_DELIVERY',
          codEligible: true,
          codLimitPaise: 100_000,
          estimatedPreparationMinutes: 20,`);
          replaceOnce(journey, "  estimatedDeliveryAt: '2026-07-16T10:35:00.000Z',", "  estimatedDeliveryAt: '2026-07-16T10:35:00.000Z',\n  cityConfigurationVersion: 1,");
          NODE
          pnpm exec prettier --write \
            apps/customer-app/src/checkout/customer-checkout-quote.screen.test.tsx \
            apps/customer-app/src/orders/customer-cod-order-journey.test.tsx

      - name: Capture customer validation
        shell: bash
        run: |
          set +e
          pnpm --filter @vastra/customer-app typecheck > /tmp/customer-typecheck.log 2>&1
          typecheck_status=$?
          pnpm --filter @vastra/customer-app test > /tmp/customer-test.log 2>&1
          test_status=$?
          echo "$typecheck_status" > /tmp/typecheck-status.txt
          echo "$test_status" > /tmp/test-status.txt
          exit 0

      - name: Upload customer diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr163-customer-diagnostics
          path: |
            /tmp/customer-typecheck.log
            /tmp/customer-test.log
            /tmp/typecheck-status.txt
            /tmp/test-status.txt
            apps/customer-app/src/checkout/customer-checkout-quote.screen.test.tsx
            apps/customer-app/src/orders/customer-cod-order-journey.test.tsx
          retention-days: 1

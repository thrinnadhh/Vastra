name: Materialize FE-S06 handover composition

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/fe-s06-implementation-integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compose:
    name: Compose and format merchant handover
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: agent/fe-s06-implementation-integration

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Update workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Compose handover into merchant order detail
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function replaceOnce(source, before, after, label) {
            if (source.includes(after)) return source;
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: expected one match, found ${count}`);
            return source.replace(before, after);
          }
          const path = 'apps/merchant-app/src/orders/merchant-order.screen.tsx';
          let source = fs.readFileSync(path, 'utf8');
          source = replaceOnce(source,
            "import { MerchantOrderDecisionActions } from './merchant-order-decision.screen';\nimport { MerchantOrderPackingActions } from './merchant-order-packing.screen';",
            "import { MerchantOrderDecisionActions } from './merchant-order-decision.screen';\nimport { MerchantOrderHandoverActions } from './merchant-order-handover.screen';\nimport type { MerchantOrderHandoverPort } from './merchant-order-handover.types';\nimport { MerchantOrderPackingActions } from './merchant-order-packing.screen';",
            'handover imports');
          source = replaceOnce(source,
            "const GROUPS: readonly MerchantOrderGroup[] = [\n  'New',\n  'Accepted',\n  'Packing',\n  'Ready',\n  'Completed',\n  'Rejected',\n];",
            "const GROUPS: readonly MerchantOrderGroup[] = [\n  'New',\n  'Accepted',\n  'Packing',\n  'Ready',\n  'Completed',\n  'Rejected',\n];\n\nconst HANDOVER_ORDER_STATUSES: ReadonlySet<MerchantOrderDetail['status']> = new Set([\n  'READY_FOR_PICKUP',\n  'CAPTAIN_SEARCHING',\n  'CAPTAIN_ASSIGNED',\n  'CAPTAIN_AT_STORE',\n  'PICKED_UP',\n]);",
            'handover statuses');
          source = replaceOnce(source,
            "  packingClient,\n  onBack,\n}: {\n  readonly orderId: string;\n  readonly orderClient: MerchantOrderReadPort;\n  readonly decisionClient?: MerchantOrderDecisionPort;\n  readonly packingClient?: MerchantOrderPackingPort;\n  readonly onBack: () => void;\n}) {",
            "  packingClient,\n  handoverClient,\n  onSessionExpired,\n  onBack,\n}: {\n  readonly orderId: string;\n  readonly orderClient: MerchantOrderReadPort;\n  readonly decisionClient?: MerchantOrderDecisionPort;\n  readonly packingClient?: MerchantOrderPackingPort;\n  readonly handoverClient?: MerchantOrderHandoverPort;\n  readonly onSessionExpired: () => void;\n  readonly onBack: () => void;\n}) {",
            'detail props');
          source = replaceOnce(source,
            "        decisionClient === undefined && packingClient === undefined ? undefined : (",
            "        decisionClient === undefined &&\n        packingClient === undefined &&\n        handoverClient === undefined ? undefined : (",
            'footer condition');
          source = replaceOnce(source,
            "            {packingClient === undefined ? null : (\n              <MerchantOrderPackingActions\n                onOrderChanged={refresh}\n                order={order}\n                packingClient={packingClient}\n              />\n            )}\n          </>",
            "            {packingClient === undefined ? null : (\n              <MerchantOrderPackingActions\n                onOrderChanged={refresh}\n                order={order}\n                packingClient={packingClient}\n              />\n            )}\n            {handoverClient === undefined || !HANDOVER_ORDER_STATUSES.has(order.status) ? null : (\n              <MerchantOrderHandoverActions\n                handoverClient={handoverClient}\n                onAuthoritativePickupConfirmed={refresh}\n                onSessionExpired={onSessionExpired}\n                orderId={order.id}\n              />\n            )}\n          </>",
            'handover footer');
          source = replaceOnce(source,
            "  packingClient,\n  pollIntervalMs = 15_000,",
            "  packingClient,\n  handoverClient,\n  onSessionExpired = () => undefined,\n  pollIntervalMs = 15_000,",
            'queue args');
          source = replaceOnce(source,
            "  readonly packingClient?: MerchantOrderPackingPort;\n  readonly pollIntervalMs?: number;",
            "  readonly packingClient?: MerchantOrderPackingPort;\n  readonly handoverClient?: MerchantOrderHandoverPort;\n  readonly onSessionExpired?: () => void;\n  readonly pollIntervalMs?: number;",
            'queue props');
          source = replaceOnce(source,
            "        {...(packingClient === undefined ? {} : { packingClient })}\n        onBack={() => {",
            "        {...(packingClient === undefined ? {} : { packingClient })}\n        {...(handoverClient === undefined ? {} : { handoverClient })}\n        onSessionExpired={onSessionExpired}\n        onBack={() => {",
            'detail composition');
          fs.writeFileSync(path, source);
          NODE

      - name: Format merchant manifest
        run: pnpm exec prettier --write apps/merchant-app/package.json

      - name: Verify generated lockfile is readable
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format readiness and session
        run: |
          pnpm exec prettier --write \
            apps/merchant-app/src/api/use-merchant-api-client.ts \
            apps/merchant-app/src/auth/merchant-api-session.tsx \
            apps/merchant-app/src/readiness/merchant-readiness-gate.tsx \
            apps/merchant-app/src/readiness/merchant-readiness-gate.test.tsx

      - name: Format alert production
        run: |
          pnpm exec prettier --write \
            apps/merchant-app/src/alerts/merchant-alert-diagnostics.screen.tsx \
            apps/merchant-app/src/alerts/merchant-alert-notification.runtime.tsx \
            apps/merchant-app/src/alerts/merchant-alert-notification.types.ts \
            apps/merchant-app/src/alerts/merchant-device-registration.client.ts \
            apps/merchant-app/src/alerts/merchant-urgent-alert.modal.tsx

      - name: Format alert tests
        run: |
          pnpm exec prettier --write \
            apps/merchant-app/src/alerts/merchant-device-registration.client.test.ts \
            apps/merchant-app/src/alerts/merchant-urgent-alert.decision.test.tsx

      - name: Format order production
        run: |
          pnpm exec prettier --write \
            apps/merchant-app/src/orders/deduplicating-merchant-order-read.port.ts \
            apps/merchant-app/src/orders/default-merchant-orders.tsx \
            apps/merchant-app/src/orders/merchant-order-decision.screen.tsx \
            apps/merchant-app/src/orders/merchant-order-handover.types.ts \
            apps/merchant-app/src/orders/merchant-order-handover.client.ts \
            apps/merchant-app/src/orders/merchant-order-handover.screen.tsx \
            apps/merchant-app/src/orders/merchant-order.screen.tsx

      - name: Format order tests
        run: |
          pnpm exec prettier --write \
            apps/merchant-app/src/orders/deduplicating-merchant-order-read.port.test.ts \
            apps/merchant-app/src/orders/merchant-order-decision.refresh.test.tsx \
            apps/merchant-app/src/orders/merchant-order-handover.client.test.ts \
            apps/merchant-app/src/orders/merchant-order-handover.screen.test.tsx

      - name: Commit composition
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/merchant-app pnpm-lock.yaml
          git commit -m "feat(merchant): compose generated pickup handover"
          git push origin HEAD:agent/fe-s06-implementation-integration

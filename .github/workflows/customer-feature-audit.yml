name: Customer feature audit

on:
  pull_request:
    paths:
      - 'apps/customer-app/**'
      - 'packages/api-client/**'
      - '.github/workflows/customer-feature-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        run: pnpm --filter @vastra/api-client build

      - name: Customer lint
        run: pnpm --filter @vastra/customer-app lint

      - name: Customer typecheck
        run: pnpm --filter @vastra/customer-app typecheck

      - name: Customer Jest and coverage
        run: |
          pnpm --filter @vastra/customer-app exec jest --runInBand \
            --coverage \
            --coverageReporters=json-summary \
            --coverageReporters=text \
            --json \
            --outputFile=customer-jest-results.json

      - name: Customer web export
        run: pnpm --filter @vastra/customer-app build

      - name: Build audit evidence
        if: always()
        run: |
          find apps/customer-app -type f \
            -not -path '*/node_modules/*' \
            -not -path '*/dist/*' \
            | sort > customer-file-inventory.txt
          cp apps/customer-app/customer-jest-results.json ./customer-jest-results.json 2>/dev/null || true
          cp apps/customer-app/coverage/coverage-summary.json ./customer-coverage-summary.json 2>/dev/null || true
          tar --exclude='apps/customer-app/node_modules' \
              --exclude='apps/customer-app/dist' \
              --exclude='apps/customer-app/coverage' \
              -czf customer-audit-source.tar.gz apps/customer-app

      - name: Upload customer audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: customer-feature-audit
          path: |
            customer-file-inventory.txt
            customer-jest-results.json
            customer-coverage-summary.json
            customer-audit-source.tar.gz
          if-no-files-found: warn
          retention-days: 3
